<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Le Chromium de Playwright ne lit pas la configuration de polices de Bazzite : sans ce fichier, aucun texte n'est rendu
     (captures sans texte, inner_text vide). Usage : FONTCONFIG_FILE=ce_fichier python3 tests/... -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <cachedir>/tmp/fc-cache-fonte</cachedir>
  <alias><family>Trebuchet MS</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Noto Sans Mono</family></prefer></alias>
  <match target="pattern"><edit name="family" mode="append_last"><string>Noto Sans</string></edit></match>
</fontconfig>
