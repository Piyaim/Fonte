# Construit l'APK Android quand une version est publiée (Releases > Draft a new release), ou à la main (onglet Actions).
# Il ajoute l'APK à la version et y met le titre et la description du fichier notes-de-version/<tag>.md.
name: Build APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Vérifier que le tag correspond à la version
        run: |
          V=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à VERSION_NAME=$V dans android/gradle.properties"
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Préparer la clé de signature (si les secrets existent)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/fonte.jks"
            echo "FONTE_KEYSTORE=$RUNNER_TEMP/fonte.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de clé de signature : l'APK sera signé avec la clé de debug (installable, mais pas pour de vraies versions)."
          fi

      - name: Construire
        env:
          FONTE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FONTE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FONTE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../fonte-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: fonte-apk
          path: fonte-*.apk

      - name: Ajouter l'APK et la description à la version
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release upload "$GITHUB_REF_NAME" "fonte-${VERSION}.apk" --clobber
          NOTES="notes-de-version/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release edit "$GITHUB_REF_NAME" --title "Fonte ${VERSION}" --notes-file "$NOTES"
          else
            echo "::warning::Pas de fichier $NOTES : la description de la version reste celle saisie à la main."
          fi
