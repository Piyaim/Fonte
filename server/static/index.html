<script>
var ACC = [['orange','Orange','#ff7a1a'],['blue','Bleu','#4dabf7'],['green','Vert','#51cf66'],['violet','Violet','#9775fa'],['red','Rouge','#ff6b6b'],['mono','Noir et blanc','linear-gradient(135deg,#111 50%,#fff 50%)']];
var ACC_TC = {orange:'#e8590c', blue:'#1971c2', green:'#2b8a3e', violet:'#7048e8', red:'#e03131', mono:'#111111'};
var ACCENT = 'orange';
try { var _a = JSON.parse(localStorage.getItem('muscu-accent') || 'null'); if (ACC_TC[_a]) ACCENT = _a; } catch (e) {}
function icoUrl(n) { if (window.FONTE_LOCAL || n !== 180) return window.FONTE_ICON(ACCENT); return '/icon/180.png?c=' + ACCENT; }   // logo SVG (menu, onglet) ; icône Apple en PNG (version serveur)
function applyAccent() {
  var d = document.documentElement, q = function (s) { return document.querySelector(s); };
  d.dataset.accent = ACCENT;
  q('meta[name="theme-color"]').content = ACC_TC[ACCENT];
  q('link[rel="manifest"]').href = '/manifest.webmanifest' + (ACCENT === 'orange' ? '' : '?c=' + ACCENT);
  q('link[rel="icon"]').href = icoUrl(192);
  q('link[rel="apple-touch-icon"]').href = icoUrl(180);
}
function hasAppIcon() { try { return !!(window.FonteApp && typeof window.FonteApp.setIcon === 'function'); } catch (e) { return false; } }
function setAccent(k) { ACCENT = k; try { localStorage.setItem('muscu-accent', JSON.stringify(k)); } catch (e) {} if (hasAppIcon()) { try { window.FonteApp.setIcon(k); } catch (e) {} } applyAccent(); accentPick(); }
function accentPick() {
  var el = document.getElementById('daccent'), lg = document.getElementById('lg');
  if (lg) lg.src = icoUrl(192);
  if (!el) return;
  el.innerHTML = '<p class="m">Couleur de l’appli</p><div class="sws">' + ACC.map(function (x) { return '<button class="sw' + (ACCENT === x[0] ? ' on' : '') + '" style="background:' + x[2] + '" onclick="setAccent(\'' + x[0] + '\')" aria-label="' + x[1] + '" aria-pressed="' + (ACCENT === x[0]) + '"></button>'; }).join('') + '</div>' + (hasAppIcon() ? '<p class="m">La couleur change l’interface et l’icône de l’écran d’accueil. Selon ton lanceur, l’icône peut mettre quelques secondes à changer.</p>' : window.FONTE_LOCAL ? '<p class="m">La couleur change l’interface de l’appli. L’icône sur l’écran d’accueil du téléphone reste orange.</p>' : '<p class="m">Sur l’écran d’accueil du téléphone, le logo d’une appli déjà installée ne change qu’en la réinstallant.</p>');
}
applyAccent();
</script>

<style>

<body>
<header class="topbar">
  <button class="ib" id="menu-btn" onclick="openMenu()" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="drawer"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <h1 id="ttl">Fonte</h1>
</header>
<main>
  <div id="app"><p class="empty">Chargement…</p></div>
</main>
<div class="bar" role="region" aria-label="Minuteur de repos"></div>
<div class="tabbar" id="tabs" role="navigation" aria-label="Navigation principale"></div>
<div class="scrim" id="scrim" onclick="closeMenu()"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Menu">
  <div class="dh"><img id="lg" class="lg" alt="" width="36" height="36"><b>Fonte</b><button class="ib" onclick="closeMenu()" aria-label="Fermer le menu"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="dnav"></div>
  <div class="dstyle" id="daccent"></div>
  <div class="dstyle" id="dgender"></div>
  <div class="dstyle" id="dscreen"></div>
</aside>
<script>
'use strict';
/* ------------------------------------------------------------------ état */
let EX = {}, WO = [], SESS = [], BW = [];
let view = 'accueil', curW = null, F = null;          // F = formulaire de séance en cours
let catQ = '', catArch = false, editEx = null;       // catalogue
let progW = null, progDraft = null;                  // éditeur de programmes
const VIEWS = [['accueil','Accueil'],['seance','Séance'],['zones','Zones'],['progres','Progrès'],['historique','Historique'],['exercices','Exercices'],['programmes','Programmes'],['jeu','Esprits'],['profil','Mon profil'],['notifications','Notifications'],['donnees','Données']];
const KIND_LABEL = {weight:'Charge × reps', reps:'Reps (lest facultatif)', time:'Durée en secondes', cardio:'Cardio (minutes)'};
const GROUP_ORDER = ['Jambes','Pectoraux','Dos','Épaules','Bras','Abdos et gainage','Cardio'];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const frDate = iso => { const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; };
const num = v => (v === '' || v == null) ? null : +String(v).replace(',', '.');
const fmt = v => v == null || v === '' ? '' : String(+(+v).toPrecision(12)).replace('.', ',');   // sans arrondi : 47,3 reste 47,3 (toPrecision efface seulement les restes de calcul du type 47,800000001)

function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function recall(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

async function api(method, url, data) {
  const r = await fetch(url, {method, headers: data ? {'Content-Type':'application/json'} : {}, body: data ? JSON.stringify(data) : undefined});
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || `Erreur ${r.status}`);
  return j;
}
async function load() {
  const s = await api('GET', '/api/state');
  EX = {}; s.exercises.forEach(e => EX[e.id] = e);
  WO = s.workouts; SESS = s.sessions; BW = s.bodyweight;
}
async function act(fn, okMsg) {
  try { await fn(); await load(); if (okMsg) toast(okMsg); R(); }
  catch (e) { toast(e.message); }
}

/* ------------------------------------------------------------------ outils métier */
function groups() {
  const set = new Set(Object.values(EX).map(e => e.grp));
  return [...GROUP_ORDER.filter(g => set.has(g)), ...[...set].filter(g => !GROUP_ORDER.includes(g)).sort()];
}
function unit(e) { return e.kind === 'time' ? 's' : e.kind === 'cardio' ? 'min' : 'reps'; }
function target(e) {
  const r = e.target_min && e.target_max && e.target_min !== e.target_max ? `${e.target_min}-${e.target_max}` : (e.target_max || e.target_min || '?');
  if (e.kind === 'cardio') return `${r} min`;
  return `${e.sets} × ${r}${e.kind === 'time' ? ' s' : ''}${e.per_side ? ' / côté' : ''}`;
}
const targetLine = e => target(e) + (e.rest && e.kind !== 'cardio' ? ` · repos ${e.rest} s` : '');   // « 3 × 10-12 · repos 90 s »
const ITEM_KEYS = ['sets', 'target_min', 'target_max', 'rest'];
function exIn(e, w) {   // l'exercice avec les réglages propres au programme w (séries, cible, repos), s'il en a ; own = réglage du programme
  const s = e && w && w.settings && w.settings[e.id]; if (!s) return e;
  const o = Object.assign({}, e, {own: true}); ITEM_KEYS.forEach(k => { if (s[k] != null) o[k] = s[k]; }); return o;
}
function exF(id) { return exIn(EX[id], F && F.wid ? WO.find(w => w.id === F.wid) : null); }   // exercice tel que réglé pour la séance en cours
const ownTag = e => e.own ? '<span class="tag">propre à ce programme</span>' : '';
function inputLabels(e) {
  return {weight: [e.assisted ? 'assist. kg' : 'kg', 'reps'], reps: ['lest kg', 'reps'], time: ['lest kg', 'secondes'], cardio: ['niveau', 'minutes']}[e.kind];
}
function setsOf(s, exId) { const x = s.entries.find(e => e.exercise_id === exId); return x ? x.sets : null; }
function refSessions(exId, wid, exceptSid) {   // séances qui contiennent l'exercice, de la plus récente à la plus ancienne : celles du même programme s'il y en a
  const all = SESS.filter(s => s.id !== exceptSid && setsOf(s, exId)).reverse(), same = wid ? all.filter(s => s.workout_id === wid) : [];
  return same.length ? same : all;
}
/* ressenti, noté 1 à 5 dans les données (inchangé). L'écran propose 3 choix : Facile = 2, Juste bien = 3, Dur = 4 ;
   les anciennes notes 1 (« très facile ») et 5 (« à fond ») se lisent Facile et Dur. */
const FEEL = [[2, 'Facile'], [3, 'Juste bien'], [4, 'Dur']];
const effLabel = n => n <= 2 ? 'Facile' : n === 3 ? 'Juste bien' : 'Dur';
function effBox(e) {   // une fois, juste après la dernière série validée (toujours en modification d'une séance passée) ; ensuite une ligne
  if (e.kind === 'cardio') return '';
  const v = (F.eff && F.eff[e.id]) || 0, rows = F.vals[e.id] || [], d = (F.dn && F.dn[e.id]) || [];
  if (v && F.effOpen !== e.id) return `<p class="feel1">Ressenti\u00a0: <b>${effLabel(v)}</b><button class="sm" onclick="F.effOpen=${e.id};R()">Changer</button></p>`;
  if (F.mode !== 'edit' && F.effOpen !== e.id && !(rows.length && rows.every((_, k) => d[k]))) return '';
  const nx = F.mode === 'new' ? feelNext(e) : null;
  return `<div class="feel" role="group" aria-label="Ressenti"><p><b>Comment c’était\u00a0?</b></p><div class="feelb">${FEEL.map(([n, t]) => `<button class="${v === n ? 'on' : ''}" aria-pressed="${v === n}" onclick="setEff(${e.id},${n})">${t}${nx ? `<small>→ ${esc(nx[n])}</small>` : ''}</button>`).join('')}</div></div>`;
}
/* conséquence de chaque choix sur le conseil de la prochaine séance de ce programme : loadTip appliqué à l'historique
   complété par la séance en cours (séries saisies, ressenti essayé). Rien ne change le conseil d'ici là sans une action de l'utilisateur
   (semaine légère, reprise et phase demandent « Accepter ») ; null pendant une semaine légère ou une reprise, qui peut finir avant. */
function feelNext(e) {
  const cs = window.PROFIL && PROFIL.coach ? PROFIL.coach() : {};
  if (cs.light) return null;
  const sets = (F.vals[e.id] || []).map(a => [num(a[0]), num(a[1])].map(x => x == null || isNaN(x) ? null : x)).filter(a => a[0] != null || a[1] != null);
  if (!sets.length) return null;
  let ref = refSessions(e.id, F.wid, F.sid);
  if (F.wid && ref.length && ref[0].workout_id !== F.wid) ref = [];   // la prochaine fois, la référence sera cette séance du programme
  return Object.fromEntries(FEEL.map(([n]) => [n, loadTip(e, [{id: 0, day: F.day, workout_id: F.wid, entries: [{exercise_id: e.id, sets, effort: n}]}, ...ref], cs, n)[0]]));
}
function setEff(id, n) { syncForm(); F.eff = F.eff || {}; F.eff[id] = n; F.effOpen = null; F.dirty = true; syncForm(); R(); }
function sessionVolume(s) {
  let v = 0;
  s.entries.forEach(en => { const e = EX[en.exercise_id]; if (e && e.kind === 'weight' && !e.assisted) en.sets.forEach(a => v += (a[0] || 0) * (a[1] || 0)); });
  return v;
}
function weekStart() { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }
function dayDate(iso) { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
function setText(e, a) {
  const [l, v] = a;

// courbes
function chart(series, unitLabel) {
  const all = series.flatMap(s => s.pts);
  if (all.length < 2) return '<p class="m">Pas encore assez de points pour tracer une courbe (il en faut au moins 2).</p>';
  const W = 320, H = 170, L = 42, Rr = 12, T = 16, B = 24;
  const t0 = Math.min(...all.map(p => p.t)), t1 = Math.max(...all.map(p => p.t));

  const pad = (v1 - v0) * 0.12 || 1; v0 -= pad; v1 += pad;

  const Y = v => T + (1 - (v - v0) / (v1 - v0)) * (H - T - B);
  const dm = t => { const d = new Date(t); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); };

  s += `<text x="${L}" y="${H - 6}">${dm(t0)}</text><text x="${W - Rr}" y="${H - 6}" text-anchor="end">${dm(t1)}</text>`;
  series.forEach((sr, i) => {
    if (!sr.pts.length) return;
    s += `<polyline class="${i ? 'l2' : 'l1'}" points="${sr.pts.map(p => X(p.t).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ')}"/>`;
    if (!i) { sr.pts.forEach(p => s += `<circle class="p1" cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6"/>`); const l = sr.pts[sr.pts.length - 1]; s += `<text class="lv" x="${Math.min(X(l.t), W - Rr)}" y="${Y(l.v) - 7}" text-anchor="end">${fmt(l.v)}</text>`; }
  });
  return s + '</svg>';
}

/* ------------------------------------------------------------------ lignes de séries

function statsHeader() {
  const ws = weekStart();
  const w = SESS.filter(s => dayDate(s.day) >= ws), n = SESS.length;
  const v = w.reduce((a, s) => a + sessionVolume(s), 0);
  const ph = phaseNow();
  return `<div class="st"><div><b>${w.length}/3</b><span>séances cette semaine</span></div><div><b>${Math.round(v)}</b><span>kg soulevés (semaine)</span></div><div><b>${n}</b><span>séances au total</span></div></div>
  ${totalBar()}<p class="m">${ph}</p><details><summary>Échauffement (8-10 min)</summary><p class="m">5 min de cardio léger, 10 rotations d'épaules et de hanches, 10 squats au poids du corps, puis 1-2 séries légères du premier exercice.</p></details>`;
}

function exCard(e) {   // un exercice dans l'Aperçu (ou en modification d'une séance passée) : vignette fixe, séries, ✓
  const rows = rowsFor(e); F.vals[e.id] = rows;
  const nw = F.mode === 'new';
  let h = `<div class="card"><div class="aph"${nw ? ` onclick="focusAt(${e.id})"` : ''}><div class="th">${diagram(e, false)}</div><div><h2>${esc(e.name)}</h2><b>${esc(targetLine(e))}</b></div></div>`;
  h += advice(e, F.sid, F.wid);
  h += setRows(e, rows, false);
  h += effBox(e);
  h += `<div class="acts">`;
  if (nw) h += `<button class="sm" onclick="focusAt(${e.id})">Faire cet exercice</button>`;
  if (e.kind !== 'cardio') h += `<button class="sm" onclick="addRow(${e.id})">+ série</button><button class="sm" onclick="delRow(${e.id})">− série</button>`;
  h += `<button class="sm" onclick="removeFromForm(${e.id})">Retirer aujourd'hui</button></div></div>`;
  return h;
}

function exOptions(exclude = []) {
  return groups().map(g => {
    const list = Object.values(EX).filter(e => e.grp === g && !e.archived && !exclude.includes(e.id)).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    return list.length ? `<optgroup label="${esc(g)}">${list.map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}</optgroup>` : '';
  }).join('');
}

function vSeance() {
  ensureForm();
  if (inFocus()) return vFocus();
  let h = '';
  if (F.mode === 'edit') {
    h += `<div class="edit-banner">Modification de la séance du ${frDate(F.day)} · ${esc(F.wname)}</div>`;
  } else {
    h += '<div class="tabs">' + WO.map(w => `<button class="${w.id === F.wid ? 'on' : ''}" onclick="pickWorkout(${w.id})">${esc(w.name)}</button>`).join('')
            + XS.map(x => `<button class="${F.xid === x.xid ? 'on' : ''}" onclick="selectX('${x.xid}')">${esc(x.label)}</button>`).join('') 
      + `<button class="${F.wid === null && !F.xid ? 'on' : ''}" onclick="pickWorkout(0)">Libre</button></div>`;
    if (F.xid) h += `<p class="sug">${esc(F.wname)} <button class="sm" onclick="delX('${F.xid}')">Supprimer cette séance</button></p>`;
    h += seanceIntro();
  }
  h += `<div class="g2"><label>Date<input id="f-day" type="date" value="${esc(F.day)}" onchange="syncForm()"></label><div></div></div>`;
  const ids = F.ids.filter(i => EX[i]);
  if (!ids.length) h += '<p class="empty">Aucun exercice. Ajoute-en ci-dessous, ou compose un programme dans l\'onglet Programmes.</p>';
  if (F.mode === 'new' && ids.length) h += '<button class="go" onclick="startFocus()">Un exercice à la fois</button>';
  ids.forEach(id => h += exCard(exF(id)));
  h += `<div class="card"><h2>Ajouter un exercice à cette séance</h2><p class="m">Pour aujourd'hui seulement. Pour l'ajouter à chaque fois, passe par Programmes.</p>
    <div class="row" style="grid-template-columns:1fr auto"><select id="f-add"><option value="">Choisir…</option>${exOptions(ids)}</select><button class="sm" onclick="addToForm()">Ajouter</button></div></div>`;
  h += `<div class="card"><h2>Notes</h2><textarea id="f-notes" placeholder="Forme, sensations, douleurs…" oninput="touched()">${esc(F.notes)}</textarea></div>`;
  h += `<button class="go" onclick="saveSession()">${F.mode === 'edit' ? 'Enregistrer les modifications' : 'Enregistrer la séance'}</button>`;
  if (F.mode === 'edit') h += `<button class="sm w" onclick="cancelEdit()">Annuler la modification</button>`;
  else if (hasValues() && !F.xid) h += `<button class="sm w" onclick="if(confirm('Vider le formulaire ?')){store(draftKey());F=newForm(F.wid);R()}">Vider le formulaire</button>`;
  return h;
}

async function saveSession() {
  syncForm();
  const entries = F.ids.filter(i => EX[i]).map(id => ({exercise_id: id,
    sets: (F.vals[id] || []).map(a => [num(a[0]), num(a[1])]).filter(a => a[0] != null || a[1] != null), effort: (F.eff && F.eff[id]) || null}))
    .filter(e => e.sets.length);
  if (!entries.length) return toast('Aucune série saisie');
  const payload = {workout_id: F.wid, workout_name: F.wname, day: F.day, notes: F.notes, entries};
  const editing = F.mode === 'edit';
  const nBefore = SESS.length;
  await act(async () => {
    if (editing) await api('PUT', `/api/sessions/${F.sid}`, payload);
    else await api('POST', '/api/sessions', payload);
    FOC = null;
    store(draftKey());
    if (F.xid) { XS = XS.filter(x => x.xid !== F.xid); saveXS(); store('muscu-xcur', undefined); }
    F = null;
    if (editing) view = 'historique';
  }, editing ? 'Séance modifiée' : 'Séance enregistrée');
  if (!editing && SESS.length > nBefore) { const ns = SESS.reduce((a, b) => b.ts > a.ts ? b : a), pr = computePRs().bySession[ns.id]; if (pr && pr.length) celebrate(pr); if (window.JEU) { const rep = JEU.award(ns.id); if (rep && !JEU.hidden()) JEU.rewardOverlay(rep); } }
  window.scrollTo(0, 0);
}
function editSession(sid) {
  const s = SESS.find(x => x.id === sid); if (!s) return;
  if (F && F.mode === 'new' && hasValues()) store(draftKey(), F);   // garde le brouillon en cours
  F = {mode: 'edit', sid, wid: s.workout_id, wname: s.workout_name, day: s.day, notes: s.notes,
       ids: s.entries.map(e => e.exercise_id), vals: {}};
  s.entries.forEach(e => F.vals[e.exercise_id] = e.sets.map(a => [a[0] ?? '', a[1] ?? '']));
  F.eff = {}; s.entries.forEach(e => { if (e.effort) F.eff[e.exercise_id] = e.effort; });
  go('seance');
}
function cancelEdit() { F = null; go('historique'); }

/* ------------------------------------------------------------------ vue Historique */
function vHisto() {
  if (!SESS.length) return '<p class="empty">Aucune séance enregistrée.</p>';
  const PRH = computePRs().bySession;
  let h = '';
  [...SESS].reverse().forEach(s => {
    const v = sessionVolume(s);
    h += `<div class="card"><h2>${frDate(s.day)} · ${esc(s.workout_name)}</h2>${v ? `<p class="m">${Math.round(v)} kg soulevés</p>` : ''}<table>`;
    s.entries.forEach(en => {
      const e = EX[en.exercise_id];
      h += `<tr><td>${e ? esc(e.name) : '?'}${PRH[s.id] && PRH[s.id].some(r => r.ex.id === en.exercise_id) ? '<span class="tag rec">record</span>' : ''}${en.effort ? `<span class="tag">${effLabel(en.effort).toLowerCase()}</span>` : ''}</td><td>${e ? en.sets.map(a => esc(setText(e, a))).join('<br>') : ''}</td></tr>`;
    });
    h += '</table>';
    if (s.notes) h += `<p class="m" style="margin-top:6px">${esc(s.notes)}</p>`;
    h += `<div class="acts"><button class="sm" onclick="editSession(${s.id})">Modifier</button><button class="sm danger" onclick="delSession(${s.id})">Supprimer</button></div></div>`;
  });
  return h;
}
function delSession(id) {
  const s = SESS.find(x => x.id === id);
  if (!confirm(`Supprimer définitivement la séance du ${frDate(s.day)} ?`)) return;
  act(() => api('DELETE', `/api/sessions/${id}`), 'Séance supprimée');
}

const KIND_DESC = {weight:'Saisie : charge et répétitions.', reps:'Saisie : répétitions (poids du corps).', time:'Saisie : durée de chaque série.', cardio:'Saisie : durée en minutes.'};

let ZDET = null, viewEx = null;
function openEx(id) { viewEx = id; R(); window.scrollTo(0, 0); }
function closeEx() { viewEx = null; R(); window.scrollTo(0, 0); }
function catOrder() {   // même ordre et mêmes filtres que la liste affichée
  const q = catQ.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const match = e => !q || (e.name + ' ' + e.focus + ' ' + e.grp).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q);
  return groups().flatMap(g => Object.values(EX).filter(e => e.grp === g && (catArch || !e.archived) && match(e)).sort((a, b) => a.archived - b.archived || a.name.localeCompare(b.name, 'fr'))).map(e => e.id);
}
function stepEx(d) {
  const ids = catOrder(), i = ids.indexOf(viewEx), j = i + d;
  if (i < 0 || j < 0 || j >= ids.length) return;
  viewEx = ids[j]; R(); window.scrollTo(0, 0);
}
function exNav(id) {
  const ids = catOrder(), i = ids.indexOf(id);
  return `<div class="exnav"><button class="sm" onclick="stepEx(-1)" ${i <= 0 ? 'disabled' : ''}>‹ Précédent</button><button class="sm" onclick="stepEx(1)" ${i < 0 || i >= ids.length - 1 ? 'disabled' : ''}>Suivant ›</button></div>`;
}
function addExToSession(id) {
  ensureForm(); F.dirty = true; syncForm(); if (!F.ids.includes(id)) F.ids.push(id);
  FOC = null; go('seance'); toast('Exercice ajouté à la séance en cours');
}
function vExDetail() {
  const e = EX[viewEx]; if (!e) { viewEx = null; return vCat(); }
  const z = zonesOf(e), info = EXINFO[e.slug], zl = a => a.map(k => ZL[k]).join(', ');
  ZDET = {p: z.p, s: z.s}; const bodies = bodySvg('front') + bodySvg('back'); ZDET = null;
  const hist = SESS.filter(s => setsOf(s, e.id));
  const chips = [target(e), e.rest ? `repos ${e.rest} s` : '', info ? info.n : '', e.assisted ? 'assisté' : '', e.per_side ? 'chaque côté' : ''].filter(Boolean);
  let h = `<div class="exd"><div class="fhead"><button class="sm" onclick="closeEx()">‹ Retour aux exercices</button><button class="sm" onclick="editEx=EX[${e.id}];viewEx=null;R();window.scrollTo(0,0)">Modifier</button></div>`;
  h += exNav(e.id);
  h += `<div class="card"><div class="big">${diagram(e, true)}</div><h2 style="margin-top:10px">${esc(e.name)}</h2><p>${chips.map(c => `<span class="tag">${esc(c)}</span>`).join(' ')}</p>${e.focus ? `<p class="m">${esc(e.focus)}</p>` : ''}<p class="m">${esc(KIND_DESC[e.kind] || '')} Touche le schéma pour mettre l'animation en pause.</p></div>`;
  h += `<div class="card"><h2>Muscles travaillés</h2><div class="body det">${bodies}</div>`
    + (z.p.length ? `<p><b>Principal :</b> ${esc(zl(z.p))}</p>` : '') + (z.s.length ? `<p><b>Secondaires :</b> ${esc(zl(z.s))}</p>` : '')
    + (e.kind === 'cardio' ? '<p class="m">Exercice cardio : il sollicite surtout le cœur et le souffle.</p>' : '') + '</div>';
  if (info) {
    h += `<div class="card"><h2>Comment le faire</h2><ol>${info.s.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>`;
    h += `<div class="card"><h2>Erreurs fréquentes</h2><ul>${info.e.map(x => `<li>${esc(x)}</li>`).join('')}</ul><p class="sug">${esc(info.c)}</p></div>`;
  } else {
    h += `<div class="card"><h2>Notes</h2>${e.tip ? `<p>${esc(e.tip)}</p>` : '<p class="m">Pas de fiche détaillée pour cet exercice que tu as créé. Ajoute une astuce via « Modifier ».</p>'}</div>`;
  }
  if (info && e.tip) h += `<div class="card"><h2>Ton astuce</h2><p>${esc(e.tip)}</p></div>`;
  // stats personnelles
  h += '<div class="card"><h2>Tes chiffres</h2>';
  if (!hist.length) h += '<p class="m">Tu n\'as pas encore fait cet exercice. Les chiffres apparaîtront après ta première séance.</p>';
  else {
    let bestSet = null, bestScore = null;
    hist.forEach(s => { const b = bestOf(e, setsOf(s, e.id)); if (b && (bestScore == null || b.score > bestScore)) { bestScore = b.score; bestSet = b.set; } });
    h += `<p><b>${hist.length}</b> séance${hist.length > 1 ? 's' : ''} · dernière le ${frDate(hist[hist.length - 1].day)}</p>`;
    if (bestSet) h += `<p><b>Meilleure série :</b> ${esc(setText(e, bestSet))}</p>`;
    h += advice(e, null).replace(/<svg[\s\S]*?<\/svg>/g, "");
    const sr = exSeries(e), lab = e.kind === 'weight' ? (e.assisted ? 'Assistance' : 'Charge max') : e.kind === 'cardio' ? 'Minutes' : e.kind === 'time' ? 'Durée (s)' : 'Meilleure série (reps)';
    h += chart([{pts: sr.pts}, {pts: sr.rm}], lab) + `<p class="m">${lab}${sr.rm.length ? ' (orange) · 1RM estimé (gris pointillé)' : ''}</p>`;
  }
  h += '</div>';
  const progs = WO.filter(w => w.items.includes(e.id)).map(w => { const x = exIn(e, w); return esc(w.name) + (x.own ? ` <span class="m">(${esc(target(x))}${x.rest && x.kind !== 'cardio' ? ', repos ' + x.rest + ' s' : ''})</span>` : ''); });
  h += `<div class="card"><h2>Dans mes programmes</h2><p>${progs.length ? progs.join(', ') : '<span class="m">Dans aucun programme pour l\'instant.</span>'}</p></div>`;
  h += `<button class="go" onclick="addExToSession(${e.id})">Ajouter à ma séance en cours</button>` + exNav(e.id) + '</div>';
  return h;
}

function vCat() {
  if (editEx) return exForm();
  if (viewEx) return vExDetail();
  let h = `<div class="card"><div class="row" style="grid-template-columns:1fr auto"><input id="q" placeholder="Rechercher un exercice" value="${esc(catQ)}" oninput="catQ=this.value;listCat()"><button class="sm" onclick="editEx={};R()">+ Nouveau</button></div>
    <label class="ck"><input type="checkbox" ${catArch ? 'checked' : ''} onchange="catArch=this.checked;listCat()">Afficher les exercices archivés</label></div><div id="catlist">${catList()}</div>`;
  return h;
}
function listCat() { $('catlist').innerHTML = catList(); }
function catList() {
  const q = catQ.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const match = e => !q || (e.name + ' ' + e.focus + ' ' + e.grp).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q);
  let h = '';
  groups().forEach(g => {
    const list = Object.values(EX).filter(e => e.grp === g && (catArch || !e.archived) && match(e)).sort((a, b) => a.archived - b.archived || a.name.localeCompare(b.name, 'fr'));
    if (!list.length) return;
    h += `<h3>${esc(g)}</h3><div class="card">`;
    list.forEach(e => {
      h += `<div class="li ${e.archived ? 'arch' : ''}"><div class="th" onclick="openEx(${e.id})">${diagram(e)}</div><div class="n" onclick="openEx(${e.id})"><b>${esc(e.name)}</b>${e.archived ? '<span class="tag">archivé</span>' : ''}${e.assisted ? '<span class="tag">assisté</span>' : ''}
        <p class="m">${esc(target(e))}${e.focus ? ' · ' + esc(e.focus) : ''}</p></div>
        <button class="sm" onclick="editEx=EX[${e.id}];R();window.scrollTo(0,0)">Modifier</button></div>`;
    });
    h += '</div>';
  });
  return h || '<p class="empty">Aucun exercice ne correspond.</p>';
}
function exForm() {
  const e = editEx, isNew = !e.id;
  const d = Object.assign({name: '', grp: GROUP_ORDER[0], kind: 'weight', sets: 3, target_min: 10, target_max: 12, rest: 90, focus: '', tip: '', green: 0, per_side: 0, assisted: 0}, e);
  const inPrograms = isNew ? [] : WO.filter(w => w.items.includes(e.id)).map(w => w.name), ownIn = isNew ? [] : WO.filter(w => exIn(e, w).own).map(w => w.name);
  let h = `<div class="card"><h2>${isNew ? 'Nouvel exercice' : 'Modifier l\'exercice'}</h2>
    <label>Nom<input id="e-name" value="${esc(d.name)}" maxlength="120"></label>
    <div class="g2"><label>Groupe<select id="e-grps" onchange="grpPick()">${grpChoices(d.grp).map(g => `<option value="${esc(g)}" ${g === d.grp ? 'selected' : ''}>${esc(g)}</option>`).join('')}<option value="">Autre groupe…</option></select></label>
      <label>Type de saisie<select id="e-kind" onchange="kindHint()">${Object.entries(KIND_LABEL).map(([k, t]) => `<option value="${k}" ${k === d.kind ? 'selected' : ''}>${t}</option>`).join('')}</select></label></div>
    <label id="e-grpl" style="display:none;margin-top:8px">Nom du nouveau groupe<input id="e-grp" value="" maxlength="60"></label>
    <div class="g3"><label>Séries<input id="e-sets" type="number" min="1" max="10" value="${d.sets}"></label>
      <label id="e-minl">Cible min<input id="e-min" type="number" min="1" value="${d.target_min ?? ''}"></label>
      <label id="e-maxl">Cible max<input id="e-max" type="number" min="1" value="${d.target_max ?? ''}"></label></div>
    <p class="m" id="e-hint"></p>
    <div class="g2"><label>Repos (s)<input id="e-rest" type="number" min="0" max="600" step="15" value="${d.rest}"></label><div></div></div>
    <label style="margin-top:8px">Rôle / muscles<input id="e-focus" value="${esc(d.focus)}" maxlength="200"></label>
    <label style="margin-top:8px">Consigne technique<textarea id="e-tip" maxlength="1000">${esc(d.tip)}</textarea></label>
    <label class="ck"><input id="e-side" type="checkbox" ${d.per_side ? 'checked' : ''}>Par côté (unilatéral)</label>
    <label class="ck" id="e-assl"><input id="e-ass" type="checkbox" ${d.assisted ? 'checked' : ''}>Machine à assistance (progresser = baisser la charge)</label>
    <button class="go" onclick="saveEx()">${isNew ? 'Créer l\'exercice' : 'Enregistrer'}</button>
    <button class="sm w" onclick="editEx=null;R()">Retour au catalogue</button>`;
  if (!isNew) {
    h += `<p class="m" style="margin-top:12px">${inPrograms.length ? 'Présent dans : ' + inPrograms.map(esc).join(', ') + '.' : 'Dans aucun programme.'} Modifier cet exercice n'efface aucun historique.</p>${ownIn.length ? `<p class="m">Réglage propre gardé dans : ${ownIn.map(esc).join(', ')}. Ces programmes ne prennent pas les séries, la cible ni le repos d'ici.</p>` : ''}<div class="acts">`;
    h += e.archived ? `<button class="sm" onclick="archEx(${e.id},false)">Restaurer</button>`
      : `<button class="sm" onclick="archEx(${e.id},true)">Archiver</button>`;
    if (!e.used) h += `<button class="sm danger" onclick="delEx(${e.id})">Supprimer</button>`;
    h += '</div>';
  }
  setTimeout(kindHint, 0);
  return h + '</div>';
}
/* Groupe : liste déroulante (le champ libre avec suggestions ne montrait que le groupe déjà écrit sur Android).
   Groupes du catalogue + groupes standard, puis « Autre groupe… » qui ouvre un champ libre. */
function grpChoices(cur) { const l = [...new Set([...GROUP_ORDER, ...groups()])]; if (cur && !l.includes(cur)) l.push(cur); return l; }
function grpPick() { const o = $('e-grps').value === ''; $('e-grpl').style.display = o ? '' : 'none'; if (o) $('e-grp').focus(); }
function grpValue() { const v = $('e-grps').value; return v === '' ? $('e-grp').value.trim() : v; }
function kindHint() {
  const k = $('e-kind') && $('e-kind').value; if (!k) return;
  $('e-hint').textContent = {weight: 'Cible en répétitions par série.', reps: 'Cible en répétitions par série, lest facultatif.', time: 'Cible en secondes par série.', cardio: 'Cible en minutes. Le nombre de séries est ignoré.'}[k];
  $('e-assl').style.display = k === 'weight' ? '' : 'none';
}
function saveEx() {
  if (!grpValue()) return toast('Écris le nom du nouveau groupe');
  const d = {name: $('e-name').value, grp: grpValue(), kind: $('e-kind').value, sets: $('e-sets').value,
    target_min: $('e-min').value, target_max: $('e-max').value, rest: $('e-rest').value, focus: $('e-focus').value,
    tip: $('e-tip').value, per_side: $('e-side').checked, assisted: $('e-ass').checked, green: !!(editEx && editEx.green)};
  const id = editEx.id;
  act(async () => { await (id ? api('PUT', `/api/exercises/${id}`, d) : api('POST', '/api/exercises', d)); editEx = null; }, id ? 'Exercice modifié' : 'Exercice créé');
}
function archEx(id, flag) {
  if (flag) {
    const progs = WO.filter(w => w.items.includes(id)).map(w => w.name);
    if (!confirm(`Archiver cet exercice ?${progs.length ? ' Il sera retiré de : ' + progs.join(', ') + '.' : ''} Son historique est conservé.`)) return;
  }
  act(async () => { await api('POST', `/api/exercises/${id}/archive`, {archived: flag}); editEx = null; progDraft = null; }, flag ? 'Exercice archivé' : 'Exercice restauré');
}
function delEx(id) {
  if (!confirm('Supprimer définitivement cet exercice (jamais utilisé) ?')) return;
  act(async () => { await api('DELETE', `/api/exercises/${id}`); editEx = null; progDraft = null; }, 'Exercice supprimé');
}

/* ------------------------------------------------------------------ vue Programmes */
function vProg() {
  if (progW !== null && !WO.some(w => w.id === progW)) { progW = null; progDraft = null; }
  if (progW === null && WO.length) progW = WO[0].id;
  let h = '<div class="tabs">' + WO.map(w => `<button class="${w.id === progW ? 'on' : ''}" onclick="selProg(${w.id})">${esc(w.name)}</button>`).join('')
    + `<button onclick="newProg()">+ Nouveau</button></div>`;
  if (progW === null) return h + '<p class="empty">Aucun programme. Crée-en un.</p>';
  const w = WO.find(x => x.id === progW);
  if (!progDraft || progDraft.id !== w.id) progDraft = {id: w.id, name: w.name, items: [...w.items], settings: JSON.parse(JSON.stringify(w.settings || {})), open: null};
  const D = progDraft;
  h += `<div class="card"><label>Nom du programme<input id="p-name" value="${esc(D.name)}" oninput="progDraft.name=this.value"></label>`;
  if (!D.items.length) h += '<p class="empty">Programme vide.</p>';
  else h += '<p class="m" style="margin-top:8px">« Régler » change les séries, la cible et le repos d’un exercice pour ce programme seulement.</p>';
  D.items.forEach((id, i) => {
    const e0 = EX[id]; if (!e0) return;
    const e = exIn(e0, D), op = D.open === id;
    h += `<div class="li"><div class="n"><b>${i + 1}. ${esc(e.name)}</b><p class="m">${esc(target(e))}${e.rest && e.kind !== 'cardio' ? ' · repos ' + e.rest + ' s' : ''}${ownTag(e)}</p>
      <button class="sm" onclick="cfgProg(${id})" aria-expanded="${op}" aria-label="Régler ${esc(e.name)} dans ce programme">Régler</button></div>
      <button class="sm mv" ${i ? '' : 'disabled'} onclick="mvProg(${i},-1)" aria-label="Monter">↑</button>
      <button class="sm mv" ${i < D.items.length - 1 ? '' : 'disabled'} onclick="mvProg(${i},1)" aria-label="Descendre">↓</button>
      <button class="sm danger mv" onclick="rmProg(${i})" aria-label="Retirer">✕</button></div>`;
    if (op) h += cfgBox(e0, D.settings[id] || {});
  });
  h += `<div class="row" style="grid-template-columns:1fr auto;margin-top:10px"><select id="p-add"><option value="">Ajouter un exercice…</option>${exOptions(D.items)}</select><button class="sm" onclick="addProg()">Ajouter</button></div>
    ${progChanged() ? '<p class="sug">Modifications non enregistrées.</p>' : ''}<button class="go" onclick="saveProg()">Enregistrer le programme</button>
    <div class="acts"><button class="sm" onclick="progDraft=null;R()">Annuler les changements</button>
    <button class="sm" onclick="mvWorkout(-1)">◀ Déplacer</button><button class="sm" onclick="mvWorkout(1)">Déplacer ▶</button>
    <button class="sm danger" onclick="delProg()">Supprimer le programme</button></div>
    <p class="m" style="margin-top:8px">Supprimer un programme ne supprime ni les exercices ni l'historique des séances.</p></div>`;
  return h;
}
function cfgBox(e, s) {   // réglage d'un exercice dans le programme : vide = valeur de l'exercice
  const u = {time: 's', cardio: 'min'}[e.kind] || 'reps', card = e.kind === 'cardio', v = k => s[k] == null ? '' : s[k];
  const f = (id, lab, k, min, max, step) => `<label>${lab}<input id="${id}" type="number" inputmode="numeric" min="${min}" max="${max}" step="${step}" value="${v(k)}" placeholder="${e[k] ?? ''}"></label>`;
  return `<div class="cfg"><p class="m">Pour ce programme seulement. Une case vide garde la valeur de l’exercice.</p><p class="m">Valeurs de l’exercice : <b>${esc(target(e))}${e.rest && !card ? ', repos ' + e.rest + ' s' : ''}</b></p>
    ${card ? '' : `<div class="g2">${f('c-sets', 'Séries', 'sets', 1, 10, 1)}${f('c-rest', 'Repos (s)', 'rest', 0, 600, 15)}</div>`}
    <div class="g2">${f('c-min', `Cible min (${u})`, 'target_min', 1, 1000, 1)}${f('c-max', `Cible max (${u})`, 'target_max', 1, 1000, 1)}</div>
    <div class="acts"><button class="sm" onclick="cfgOk(${e.id})">Valider</button><button class="sm" onclick="cfgReset(${e.id})">Revenir aux valeurs de l’exercice</button><button class="sm" onclick="progDraft.open=null;R()">Fermer</button></div></div>`;
}
function cfgProg(id) { progDraft.open = progDraft.open === id ? null : id; R(); }
function cfgOk(id) {
  const rd = (k, lo, hi) => { const el = $(k); if (!el || el.value.trim() === '') return null; const n = Math.trunc(num(el.value)); return isFinite(n) ? Math.max(lo, Math.min(hi, n)) : null; };
  let mn = rd('c-min', 1, 1000), mx = rd('c-max', 1, 1000);
  if (mn == null) mn = mx; if (mx == null) mx = mn; if (mn && mx && mx < mn) [mn, mx] = [mx, mn];   // mêmes règles que le serveur
  const s = {sets: rd('c-sets', 1, 10), target_min: mn, target_max: mx, rest: rd('c-rest', 0, 600)};
  if (ITEM_KEYS.some(k => s[k] != null)) progDraft.settings[id] = s; else delete progDraft.settings[id];
  progDraft.open = null; R();
}
function cfgReset(id) { delete progDraft.settings[id]; progDraft.open = null; R(); }
function progSettings(D) { const o = {}; D.items.forEach(id => { if (D.settings[id]) o[id] = D.settings[id]; }); return o; }
function progChanged() {
  const D = progDraft, w = D && WO.find(x => x.id === D.id); if (!w) return false;
  return D.name !== w.name || JSON.stringify(D.items) !== JSON.stringify(w.items) || JSON.stringify(progSettings(D)) !== JSON.stringify(progSettings({items: w.items, settings: w.settings || {}}));
}
function selProg(id) { progW = id; progDraft = null; R(); }
function mvProg(i, d) { const a = progDraft.items; [a[i], a[i + d]] = [a[i + d], a[i]]; R(); }
function rmProg(i) { const [id] = progDraft.items.splice(i, 1); delete progDraft.settings[id]; if (progDraft.open === id) progDraft.open = null; R(); }
function addProg() { const id = +$('p-add').value; if (id) { progDraft.items.push(id); R(); } }
function saveProg() {
  if (progDraft.open != null && $('c-min')) cfgOk(progDraft.open);   // réglage ouvert mais pas validé : on le garde
  const D = progDraft;
  act(async () => { await api('PUT', `/api/workouts/${D.id}`, {name: D.name, items: D.items, settings: progSettings(D)}); progDraft = null; if (F && F.mode === 'new' && F.wid === D.id && !hasValues()) F = null; }, 'Programme enregistré');
}
function newProg() {
  const name = prompt('Nom du nouveau programme', `Séance ${String.fromCharCode(65 + WO.length)}`);
  if (!name) return;
  act(async () => { const r = await api('POST', '/api/workouts', {name}); progW = r.id; progDraft = null; }, 'Programme créé');
}
function delProg() {
  const w = WO.find(x => x.id === progW);
  if (!confirm(`Supprimer le programme « ${w.name} » ?`)) return;
  act(async () => { await api('DELETE', `/api/workouts/${w.id}`); progW = null; progDraft = null; if (F && F.wid === w.id) F = null; }, 'Programme supprimé');
}
function mvWorkout(d) {
  const ids = WO.map(w => w.id), i = ids.indexOf(progW), j = i + d;
  if (j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  act(() => api('POST', '/api/workouts/order', {ids}));
}

/* ------------------------------------------------------------------ vue Données */
function vData() {
  const last = BW.length ? BW[BW.length - 1].kg : '';
  let h = window.PROFIL && PROFIL.imposed() ? `<button class="sm w" onclick="go('profil')">‹ Retour au questionnaire</button>` : '';
  h += `<div class="card"><h2>Poids de corps</h2><div class="row" style="grid-template-columns:1fr auto"><input id="pw" type="number" inputmode="decimal" step="0.1" placeholder="kg" value="${last}"><button class="sm" onclick="addBW()">Ajouter</button></div>
    ${spark(BW.slice(-12).map(a => a.kg), 'Poids, ' + Math.min(BW.length, 12) + ' pesées')}`;
  if (BW.length) h += '<table>' + BW.slice(-6).reverse().map(b => `<tr><td>${frDate(b.day)}</td><td>${fmt(b.kg)} kg</td><td style="text-align:right"><button class="sm danger" onclick="delBW(${b.id})" aria-label="Supprimer">✕</button></td></tr>`).join('') + '</table>';
  h += `</div><div class="card"><h2>Sauvegarde</h2>
    <p class="m">${window.FONTE_LOCAL ? 'Tes données sont stockées sur ce téléphone, dans l’appli : si tu la désinstalles ou effaces ses données, elles disparaissent. Exporte-les régulièrement ; séances et photos sont dans deux fichiers séparés. L’export contient aussi ton profil, y compris tes réponses au questionnaire de santé : garde ce fichier pour toi.' : 'La base est sur le serveur. L’export sert de copie manuelle. Ton profil (questionnaire de départ) reste dans ce navigateur et n’est pas dans cet export.'}</p>
    <a class="sm" style="display:inline-block;text-decoration:none;margin-top:6px" href="/api/export" onclick="return exportClick('data')">Télécharger l'export (JSON)</a>${window.FONTE_LOCAL ? ' <a class="sm" style="display:inline-block;text-decoration:none;margin-top:6px" href="#" onclick="return exportClick(\'photos\')">Télécharger les photos (JSON)</a>' : ''}
    <h3>Importer</h3>
    <p class="m">• Export de l'ancienne appli (bouton « Exporter » puis copier) : les séances sont <b>ajoutées</b>, les doublons ignorés.<br>• Export de ce service : <b>remplace toute la base</b>.${window.FONTE_LOCAL ? '<br>• Export des photos : les photos sont <b>ajoutées</b>.' : ''}</p>
    <textarea id="bk" placeholder="Colle le JSON ici"></textarea>
    <p class="m">ou</p><input type="file" id="bkf" accept="application/json,.json" onchange="readFile(this)">
    <button class="go" onclick="doImport()">Importer</button></div>`;
  return h;
}
function addBW() { const kg = num($('pw').value); if (!kg) return; act(() => api('POST', '/api/bodyweight', {kg}), 'Pesée ajoutée'); }
function delBW(id) { if (confirm('Supprimer cette pesée ?')) act(() => api('DELETE', `/api/bodyweight/${id}`)); }
function readFile(inp) { const f = inp.files[0]; if (!f) return; f.text().then(t => $('bk').value = t); }
function doImport() {
  let o; try { o = JSON.parse($('bk').value); } catch (e) { return toast('JSON invalide'); }
  if (o && o.format === 'suivi-muscu' && !confirm('Cet export va REMPLACER toute la base actuelle (exercices, programmes, séances, pesées). Continuer ?')) return;
  const imposed = !!(window.PROFIL && PROFIL.imposed());
  act(async () => {
    const r = await api('POST', '/api/import', o);
    F = null; progDraft = null; store(draftKey());
    if (window.PROFIL) PROFIL.afterImport(o);   // import réussi : le questionnaire saute (un import annulé ou refusé n'arrive jamais ici)
    if (imposed) { view = 'accueil'; store('muscu-view', view); }
    alert('Import terminé\u00a0: ' + Object.entries(r).map(([k, v]) => `${k}\u00a0: ${v}`).join(', '));
  });
}

/* ------------------------------------------------------------------ minuteur */
/* Le minuteur est une barre en bas de l'écran, visible sur tous les onglets pendant un repos :
   grand compte à rebours, −15 s, +15 s, Passer, autre durée, et la série suivante. Hors repos, sur l'onglet Séance seulement. */
let T = 0, TI, TEND = 0, TDUR = 0, TMID = null, TMO = false, BARX = false;   // BARX : minuteur agrandi d'un toucher hors de l'onglet Séance
const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function tk() {
  const s = Math.max(T, 0), m = $('tm'), p = $('tmp');
  if (m) m.textContent = mmss(s);
  if (p) p.style.width = (TDUR ? Math.min(100, s * 1000 / TDUR * 100) : 0) + '%';
}
function ring() {
  try { navigator.vibrate && navigator.vibrate([300, 100, 300]); const c = new AudioContext(), o = c.createOscillator(); c.resume && c.resume(); o.connect(c.destination); o.start(); o.stop(c.currentTime + .4); } catch (e) {}
}
function tmStore() { store('muscu-timer', TEND || undefined); store('muscu-timer-i', TEND ? {d: TDUR, id: TMID} : undefined); }
function tkNow() {   // le temps restant se calcule sur l'heure réelle : il reste juste si le téléphone se verrouille ou si on change d'appli
  if (!TEND) return;
  T = Math.max(0, Math.ceil((TEND - Date.now()) / 1000)); tk();
  if (T <= 0) {
    const late = Date.now() - TEND;
    clearInterval(TI); TEND = 0; tmStore();
    if (late < 20000) { ring(); toast('Repos terminé'); }
    barRender(); screenSync();
  }
}
function TM(s, id) {
  clearInterval(TI); TDUR = s * 1000; TEND = Date.now() + TDUR; TMID = id ?? curExId(); TMO = false; tmStore();
  barRender(); tkNow(); screenSync();
  TI = setInterval(tkNow, 250);
  if (window.NOTIF) NOTIF.rest(s, nextSet(TMID));   // fin du repos, écran verrouillé (appli Android, si activée)
}
function TMadd(d) {   // −15 s ou +15 s ; à zéro, le repos s'arrête sans sonner
  if (!TEND) return;
  TEND += d * 1000; TDUR = Math.max(1000, TDUR + d * 1000);
  if (TEND <= Date.now() + 500) return TMskip();
  tmStore(); tkNow();
  if (window.NOTIF) NOTIF.rest(T, nextSet(TMID));
}
function TMskip() {
  clearInterval(TI); TEND = 0; T = 0; TMO = false; tmStore();
  if (window.NOTIF) NOTIF.rest(0);
  barRender(); screenSync();
}
function TMmore() { TMO = !TMO; barRender(); }
function curExId() { if (!F || !inFocus()) return null; const ids = F.ids.filter(i => EX[i]); return ids[Math.min(FOC ?? firstUndone(), ids.length - 1)] ?? null; }
function nextInfo(id) {   // « Presse à cuisses · série 2 sur 3 · 47,5 kg × 10 »
  if (!F) return '';
  const ids = F.ids.filter(i => EX[i]), st = id != null ? Math.max(0, ids.indexOf(id)) : FOC != null ? FOC : 0;
  for (const i of ids.slice(st)) {
    const e = exF(i), rows = F.vals[i] || rowsFor(e), d = (F.dn && F.dn[i]) || [], k = rows.findIndex((_, j) => !d[j]);
    if (k < 0) continue;
    const a = [num(rows[k][0]), num(rows[k][1])].map(x => x == null || isNaN(x) ? null : x);
    return `${i === id ? '' : e.name + ' · '}série ${k + 1} sur ${rows.length}${a[1] != null ? ' · ' + setText(e, a) : ''}`;   // nom seulement si l'exercice change
  }
  return '';
}
function barRender() {
  const b = document.querySelector('.bar'); if (!b) return;
  if (!TEND) BARX = false;
  const away = view !== 'seance', compact = !!TEND && away && !BARX;   // hors de l'onglet Séance : une ligne (temps restant, Passer), agrandie au toucher
  document.body.classList.toggle('rest-on', !!TEND); document.body.classList.toggle('barc', compact);
  if (compact) {
    b.innerHTML = `<div class="rb-c"><button class="rb-cx" onclick="BARX=true;barRender()" aria-expanded="false" aria-label="Agrandir le minuteur de repos"><span class="m">Repos</span><b id="tm" role="timer" aria-live="off">${mmss(Math.max(T, 0))}</b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><button class="sm" onclick="TMskip()">Passer</button></div>`;
    return tk();
  }
  const more = TMO ? `<div class="rb-more">${[60, 90, 120].map(x => `<button class="sm" onclick="TM(${x}, TMID)">${x < 120 ? x + ' s' : '2 min'}</button>`).join('')}</div>` : '';
  if (TEND) {
    const nx = nextInfo(TMID);
    b.innerHTML = `<div class="rb-top">${away ? '<button class="sm rb-red" onclick="BARX=false;barRender()" aria-expanded="true" aria-label="Réduire le minuteur de repos">Réduire</button>' : '<span class="m">Repos</span>'}<b id="tm" role="timer" aria-live="off">${mmss(Math.max(T, 0))}</b><button class="sm" onclick="TMskip()">Passer</button></div>`
      + `<div class="pbar"><i id="tmp"></i></div>`
      + `<div class="rb-btn"><button class="sm" onclick="TMadd(-15)" aria-label="Moins 15 secondes">−15 s</button><button class="sm" onclick="TMadd(15)" aria-label="Plus 15 secondes">+15 s</button><button class="sm" onclick="TMmore()" aria-expanded="${TMO}">Autre durée</button></div>`
      + more + (nx ? `<p class="rb-next">Ensuite\u00a0: ${esc(nx)}</p>` : '');
    tk();
  } else {
    const id = curExId(), e = id != null ? exF(id) : null, d = e && e.rest && e.kind !== 'cardio' ? e.rest : 90;
    b.innerHTML = `<div class="rb-idle"><span class="m">Repos</span><button class="sm" onclick="TM(${d}, curExId())">Lancer · ${d < 120 || d % 60 ? d + ' s' : d / 60 + ' min'}</button><button class="sm" onclick="TMmore()" aria-expanded="${TMO}">Autre durée</button></div>` + more;
  }
}
function nextSet(id) {   // « Prochaine série : Développé couché, série 3 sur 4. » : première série non validée, à partir de l'exercice en cours
  if (!F) return null;
  const ids = F.ids.filter(i => EX[i]), st = id != null ? Math.max(0, ids.indexOf(id)) : FOC != null ? FOC : 0;
  for (const i of ids.slice(st)) {
    const rows = F.vals[i] || rowsFor(exF(i)), d = (F.dn && F.dn[i]) || [], k = rows.findIndex((_, j) => !d[j]);
    if (k >= 0) return `Prochaine série\u00a0: ${EX[i].name}, série ${k + 1} sur ${rows.length}.`;
  }
  return null;
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) tkNow(); SCRON = null; screenSync(); });
(function () {   // minuteur en cours quand la page a été rechargée ou fermée par le système
  const te = +recall('muscu-timer') || 0, inf = recall('muscu-timer-i') || {};
  if (te > Date.now()) { TEND = te; TDUR = inf.d || Math.max(1000, te - Date.now()); TMID = inf.id ?? null; tkNow(); TI = setInterval(tkNow, 250); }
  else { store('muscu-timer', undefined); store('muscu-timer-i', undefined); }
})();

/* ------------------------------------------------------------------ écran allumé pendant la séance
   En mode « un exercice à la fois » et pendant un repos ; réglage du menu, activé par défaut.
   Appli Android : la coque pose FLAG_KEEP_SCREEN_ON (FonteApp.keepScreenOn). Navigateur : Screen Wake Lock, s'il existe. */
function screenSync() {
  const on = SCREEN && !document.hidden && (!!TEND || inFocus());
  if (on === SCRON) return; SCRON = on;
  try { if (window.FonteApp && typeof window.FonteApp.keepScreenOn === 'function') { window.FonteApp.keepScreenOn(on); return; } } catch (e) {}
  try {
    if (on && navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { if (SCRON) WAKE = l; else l.release(); }).catch(() => {});
    else if (!on && WAKE) { WAKE.release(); WAKE = null; }
  } catch (e) {}
}
function setScreen(on) { SCREEN = on; store('muscu-ecran', on); SCRON = null; screenSync(); screenPick(); }
function screenPick() {
  const el = $('dscreen'); if (!el) return;
  el.innerHTML = `<div class="ntg"><div><p class="m">Pendant la séance</p><b>Garder l’écran allumé</b></div><button class="sw2" role="switch" aria-checked="${SCREEN}" aria-label="Garder l’écran allumé pendant la séance" onclick="setScreen(${!SCREEN})"></button></div>`;
}


/* ------------------------------------------------------------------ photos de progression (stockées localement uniquement) */
let PH = null;
async function loadPhotos() {
  try { const r = await fetch('/api/photos'); if (r.ok) { PH = await r.json(); if (view === 'progres' && !$('phov')) R(); } } catch (e) {}
}
async function shrink(file, max, q) {   // redimensionne et ré-encode en JPEG : retire aussi les métadonnées (position GPS comprise)
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((ok, ko) => c.toBlob(b => b ? ok(b) : ko(new Error('Image illisible')), 'image/jpeg', q));
}
async function addPhoto(inp) {
  const f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
  const note = ($('ph-note') || {}).value || '';
  try {
    toast('Envoi de la photo…');
    const [big, small] = await Promise.all([shrink(f, 1280, .82), shrink(f, 480, .75)]);
    const fd = new FormData(); fd.append('img', big, 'p.jpg'); fd.append('thumb', small, 't.jpg'); fd.append('day', today()); fd.append('note', note);
    const r = await fetch('/api/photos', {method: 'POST', body: fd});
    if (!r.ok) { let j = null; try { j = await r.json(); } catch (e) {} throw new Error((j && j.error) || 'Erreur ' + r.status); }
    await loadPhotos(); toast('Photo enregistrée');
  } catch (e) { toast('Échec : ' + e.message); }
}
function showPhoto(i) {
  let o = $('phov');
  if (!PH || !PH[i]) { if (o) o.remove(); return; }
  if (!o) { o = document.createElement('div'); o.id = 'phov'; o.className = 'pr-overlay'; o.onclick = ev => { if (ev.target === o) o.remove(); }; document.body.appendChild(o); }
  const p = PH[i];
  o.innerHTML = `<div class="phv"><img src="${photoUrl(p.id, 'full')}" alt="Photo du ${frDate(p.day)}"><p><b>${frDate(p.day)}</b>${p.note ? ' · ' + esc(p.note) : ''}</p><div class="acts"><button class="sm" onclick="showPhoto(${i - 1})" ${i <= 0 ? 'disabled' : ''}>‹</button><button class="sm" onclick="showPhoto(${i + 1})" ${i >= PH.length - 1 ? 'disabled' : ''}>›</button><button class="sm danger" onclick="delPhoto(${p.id})">Supprimer</button><button class="sm" onclick="$('phov').remove()">Fermer</button></div></div>`;
}
async function delPhoto(id) {
  if (!confirm('Supprimer définitivement cette photo ?')) return;
  try { const r = await fetch('/api/photos/' + id, {method: 'DELETE'}); if (!r.ok) throw new Error('Erreur ' + r.status); const o = $('phov'); if (o) o.remove(); await loadPhotos(); toast('Photo supprimée'); }
  catch (e) { toast('Échec : ' + e.message); }
}
function vPhotos() {
  if (PH === null) { PH = []; loadPhotos(); }
  let h = `<div class="card"><h2>Photos de progression</h2><p class="m">${window.FONTE_LOCAL ? 'Stockées uniquement sur ce téléphone, envoyées nulle part.' : 'Stockées uniquement sur ton serveur, envoyées nulle part ailleurs.'} Pour bien comparer : même lumière, même pose, même distance.</p>`;
  if (PH.length >= 2) {
    const a = PH[0], b = PH[PH.length - 1];
    h += `<div class="phcmp"><figure><img src="${photoUrl(a.id, 'full')}" alt="Première photo"><figcaption>Départ · ${frDate(a.day)}</figcaption></figure><figure><img src="${photoUrl(b.id, 'full')}" alt="Dernière photo"><figcaption>Dernière · ${frDate(b.day)}</figcaption></figure></div>`;
  }
  if (PH.length) h += '<div class="phgrid">' + PH.map((p, i) => `<button onclick="showPhoto(${i})" aria-label="Photo du ${frDate(p.day)}"><img src="${photoUrl(p.id, 'thumb')}" loading="lazy" alt=""><span>${frDate(p.day).slice(0, 5)}</span></button>`).join('') + '</div>';
  else h += '<p class="m">Aucune photo pour l\'instant.</p>';
  h += `<div class="row" style="grid-template-columns:1fr auto"><input id="ph-note" maxlength="200" placeholder="Note (facultatif)"><button class="sm" onclick="$('ph-in').click()">Ajouter une photo</button></div><input id="ph-in" type="file" accept="image/*" hidden onchange="addPhoto(this)"></div>`;
  return h;
}

/* passerelle lue par jeu.js (les let/const ci-dessus ne sont pas sur window) */
/* après le remplacement des programmes par le questionnaire : les séances en cours non enregistrées sont gardées,
   rattachées à « séance libre » ; un formulaire vide et intact est simplement oublié */
function forgetWorkouts(ids) {
  const gone = f => f && f.wid != null && ids.includes(f.wid);
  if (gone(F)) { if (F.dirty || F.xid || F.mode === 'edit') { F.wid = null; if (!F.xid && F.mode === 'new') store(draftKey(), F); } else { F = null; store(draftKey()); } }
  XS.forEach(x => { if (gone(x)) x.wid = null; }); saveXS();
  const d = recall(draftKey());
  if (gone(d)) { if (d.dirty) { d.wid = null; store(draftKey(), d); } else store(draftKey()); }
  curW = null; progW = null; progDraft = null; FOC = null;
}
function pendingDraft() { const d = recall(draftKey()); return XS.length > 0 || !!(d && d.dirty) || !!(F && F.mode === 'new' && F.dirty); }
window.APPX = {SESS: () => SESS, EX: () => EX, WO: () => WO, zonesOf, mondayOf, today, get WGOAL() { return WGOAL; }, computePRs, figSvg, toast, R, go, nav, api, load, forgetWorkouts, pendingDraft, nextWorkout, view: () => view};

/* ------------------------------------------------------------------ démarrage */
if (!window.FONTE_LOCAL && 'serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
(async () => {
  /* l'appli s'ouvre sur l'accueil */
  try { await load(); if (window.JEU) { JEU.init(); JEU.applyWardrobe(); } if (window.PROFIL && PROFIL.init()) view = 'profil'; R(); }
  catch (e) { $('app').innerHTML = `<p class="empty">${window.FONTE_LOCAL ? 'Impossible de lire les données de l’appli' : 'Impossible de joindre le serveur'}\u00a0: ${esc(e.message)}</p>`; }
})();
</script>
