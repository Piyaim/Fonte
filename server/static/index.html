<script>
var ACC = [['orange','Orange','#ff7a1a'],['blue','Bleu','#4dabf7'],['green','Vert','#51cf66'],['violet','Violet','#9775fa'],['red','Rouge','#ff6b6b'],['mono','Noir et blanc','linear-gradient(135deg,#111 50%,#fff 50%)']];
var ACC_TC = {orange:'#e8590c', blue:'#1971c2', green:'#2b8a3e', violet:'#7048e8', red:'#e03131', mono:'#111111'};
var ACCENT = 'orange';
try { var _a = JSON.parse(localStorage.getItem('muscu-accent') || 'null'); if (ACC_TC[_a]) ACCENT = _a; } catch (e) {}
function icoUrl(n) { if (window.FONTE_LOCAL || n !== 180) return window.FONTE_ICON(ACCENT); return '/icon/180.png?c=' + ACCENT; }   // logo SVG (menu, onglet) ; icône Apple en PNG (version serveur)
function applyAccent() {
  var d = document.documentElement, q = function (s) { return document.querySelector(s); };
  d.dataset.accent = ACCENT;
  q('meta[name="theme-color"]').content = ACC_TC[ACCENT];
  q('link[rel="manifest"]').href = '/manifest.webmanifest' + (ACCENT === 'orange' ? '' : '?c=' + ACCENT);
  q('link[rel="icon"]').href = icoUrl(192);
  q('link[rel="apple-touch-icon"]').href = icoUrl(180);
}
function hasAppIcon() { try { return !!(window.FonteApp && typeof window.FonteApp.setIcon === 'function'); } catch (e) { return false; } }
function setAccent(k) { ACCENT = k; try { localStorage.setItem('muscu-accent', JSON.stringify(k)); } catch (e) {} if (hasAppIcon()) { try { window.FonteApp.setIcon(k); } catch (e) {} } applyAccent(); accentPick(); }
function accentPick() {
  var el = document.getElementById('daccent'), lg = document.getElementById('lg');
  if (lg) lg.src = icoUrl(192);
  if (!el) return;
  el.innerHTML = '<p class="m">Couleur de l’appli</p><div class="sws">' + ACC.map(function (x) { return '<button class="sw' + (ACCENT === x[0] ? ' on' : '') + '" style="background:' + x[2] + '" onclick="setAccent(\'' + x[0] + '\')" aria-label="' + x[1] + '" aria-pressed="' + (ACCENT === x[0]) + '"></button>'; }).join('') + '</div>' + (hasAppIcon() ? '<p class="m">La couleur change l’interface et l’icône de l’écran d’accueil. Selon ton lanceur, l’icône peut mettre quelques secondes à changer.</p>' : window.FONTE_LOCAL ? '<p class="m">La couleur change l’interface de l’appli. L’icône sur l’écran d’accueil du téléphone reste orange.</p>' : '<p class="m">Sur l’écran d’accueil du téléphone, le logo d’une appli déjà installée ne change qu’en la réinstallant.</p>');
}
applyAccent();
</script>

:root .tabbar button.on .ic{background:var(--a);color:var(--on)}
:root .go{font-weight:800;letter-spacing:.01em}
:root .zc{border-width:2px;border-radius:999px}

/* ---- personnage (figure.js) ---- */
:root{--f1:#cdd4da;--f2:#b2bcc5;--f3:#6f7e8a;--f4:#8d9ba6;--f5:#4a3b33;--f6:#2a3640;--f7:#10202b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--f1:#5a6d7d;--f2:#46576a;--f3:#2d3b47;--f4:#3b4b59;--f5:#8a6c58;--f6:#d9e1e7;--f7:#e8eef2}}
:root[data-theme="dark"]{--f1:#5a6d7d;--f2:#46576a;--f3:#2d3b47;--f4:#3b4b59;--f5:#8a6c58;--f6:#d9e1e7;--f7:#e8eef2}
.fb{fill:var(--f1)}.fbk{fill:var(--f2)}.fcl{fill:var(--f3)}.fcl2{fill:var(--f4)}.fhr{fill:var(--f5)}.fsh{fill:var(--f6)}.fsh2{fill:var(--f6);opacity:.75}
.fm{fill:var(--fxc,var(--a))}.fpr{fill:var(--l)}.fprl{fill:none;stroke:var(--l);stroke-width:2.2;stroke-linecap:round}
.fpl circle{fill:var(--f7);fill-opacity:.1;stroke:var(--f7);stroke-width:1.5;opacity:.85}.fpl .fhub{fill:var(--f7);stroke:none;fill-opacity:1;opacity:.85}
.fhub{fill:var(--f7)}.fcab{fill:none;stroke:var(--f7);stroke-width:.6;opacity:.65}.fcab2{fill:none;stroke:var(--f7);stroke-width:1.2;opacity:.8}
.fpl2{fill:var(--f7);opacity:.75}.fdb rect{fill:var(--f7);opacity:.85}.fdb path{stroke:var(--bg);stroke-width:.6;fill:none}
.fsh0{fill:none;stroke:var(--l);stroke-width:1}.fsd{fill:var(--f7);opacity:.09}
.fln{fill:none;stroke:var(--f2);stroke-width:.5;opacity:.7;stroke-linecap:round}.flh{fill:var(--f2)}
svg.fig{width:100%;display:block}
.top:not(.topf) svg.fig{width:120px}

/* ---- couleur de l'appli (patch F) ---- */
:root{--g1:#c25008;--g2:#b5470a}   /* --g1, --g2 : couleurs des confettis du record (celebrate) ; l'ancien dégradé de l'accueil (--g3, --gs) n'existe plus */
.lg{width:36px;height:36px;border-radius:9px;margin-left:2px}
.sws{display:flex;gap:12px;margin:10px 2px 8px}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--c);box-shadow:0 0 0 2px var(--l);padding:0}
.sw.on{box-shadow:0 0 0 3px var(--t)}
:root[data-accent="blue"]{--a:#1971c2;--at:#1864ab;--on:#fff;--g1:#1a73c4;--g2:#1864ab;--cta-b:#135a9c}
@media(prefers-color-scheme:dark){:root[data-accent="blue"]:not([data-theme="light"]){--a:#4dabf7;--at:#4dabf7;--on:#06131f}}
:root[data-accent="blue"][data-theme="dark"]{--a:#4dabf7;--at:#4dabf7;--on:#06131f}
:root[data-accent="green"]{--a:#277c38;--at:#226f32;--on:#fff;--g1:#22803a;--g2:#1f7432;--cta-b:#1b5e28}
@media(prefers-color-scheme:dark){:root[data-accent="green"]:not([data-theme="light"]){--a:#51cf66;--at:#51cf66;--on:#07170c}}
:root[data-accent="green"][data-theme="dark"]{--a:#51cf66;--at:#51cf66;--on:#07170c}
:root[data-accent="violet"]{--a:#7048e8;--at:#6741d9;--on:#fff;--g1:#7a52f0;--g2:#6741d9;--cta-b:#5a35c9}
@media(prefers-color-scheme:dark){:root[data-accent="violet"]:not([data-theme="light"]){--a:#9775fa;--at:#9775fa;--on:#120a26}}
:root[data-accent="violet"][data-theme="dark"]{--a:#9775fa;--at:#9775fa;--on:#120a26}
:root[data-accent="red"]{--a:#e03131;--at:#c92a2a;--on:#fff;--g1:#d63030;--g2:#c92a2a;--cta-b:#a81e1e}
@media(prefers-color-scheme:dark){:root[data-accent="red"]:not([data-theme="light"]){--a:#ff6b6b;--at:#ff6b6b;--on:#240808}}
:root[data-accent="red"][data-theme="dark"]{--a:#ff6b6b;--at:#ff6b6b;--on:#240808}
/* noir et blanc : noir sur fond clair, blanc sur fond sombre ; logo noir sur fond blanc */
:root[data-accent="mono"]{--a:#111;--at:#111;--on:#fff;--g1:#4b5157;--g2:#262b30;--cta-b:#111}
@media(prefers-color-scheme:dark){:root[data-accent="mono"]:not([data-theme="light"]){--a:#f1f3f5;--at:#f1f3f5;--on:#111}}
:root[data-accent="mono"][data-theme="dark"]{--a:#f1f3f5;--at:#f1f3f5;--on:#111}
[data-accent="mono"] .lg{box-shadow:0 0 0 1px var(--l)}
/* bord du bouton principal (--cta-b) : une teinte plus foncée de l'accent en clair, l'accent lui-même en sombre (aucun bord visible) */
@media(prefers-color-scheme:dark){:root[data-accent]:not([data-theme="light"]){--cta-b:var(--a)}}
:root[data-accent][data-theme="dark"]{--cta-b:var(--a)}

/* ---- questionnaire de départ et profil (profil.js) ---- */
body.onb .tabbar,body.onb #menu-btn{display:none}
body.onb main{padding-bottom:40px}
.qt{font-size:22px;line-height:1.25;margin:2px 0 6px;outline:none}
.qprog{margin:4px 2px 8px}
.qopt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;text-align:left;margin-top:8px;padding:12px 14px;border:2px solid var(--l);border-radius:14px;background:var(--bg);color:var(--t);font:inherit;font-size:16px}
.qopt.on{border-color:var(--a);box-shadow:inset 0 0 0 1px var(--a)}
.qck{flex:none;width:24px;height:24px;display:grid;place-items:center;border:2px solid var(--m);border-radius:50%;font-size:14px;font-weight:800;color:var(--on)}
.qck.qsq{border-radius:7px}
.qopt.on .qck{background:var(--a);border-color:var(--a)}
.qlab{margin-top:12px;font-size:14px}
.qinp{font-size:22px;padding:14px 12px;margin-top:6px}
.qnum{display:flex;align-items:center;gap:10px}.qnum b{font-size:18px;color:var(--m)}
.qerr{color:var(--warn);font-weight:700;margin:10px 0 0;min-height:1px}
.qwarn{border:2px solid var(--warn);border-radius:16px;padding:12px 14px;margin:10px 0;background:var(--c)}
.qwarn p{margin:4px 0}
.qnav{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:16px}
.qnav .sm{min-height:52px}.qnav .go{margin:0}
.qyn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--l)}
.qyn:first-of-type{border-top:0}
.qynb{display:flex;gap:6px;flex:none}
.qynb button{min-width:62px;min-height:46px;border:2px solid var(--l);border-radius:12px;background:var(--bg);color:var(--t);font:inherit;font-weight:700}
.qynb button.on{background:var(--a);border-color:var(--a);color:var(--on)}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.qchip{min-height:44px;padding:8px 12px;border:2px solid var(--l);border-radius:999px;background:var(--bg);color:var(--t);font:inherit;font-size:14px;text-align:left}
.qchip.on{background:var(--a);border-color:var(--a);color:var(--on)}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--l)}
.qrow:first-of-type{border-top:0}
.qrow>div{min-width:0}.qrow p{margin:2px 0;overflow-wrap:anywhere}
.qrow .sm{flex:none;min-height:44px}
.qex{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--l)}
.qex:first-of-type{border-top:0}.qex span{color:var(--m);font-size:14px}
.qul{margin:8px 0;padding-left:20px}.qul li{margin:6px 0}
.qmiss{border-left:4px solid var(--warn);padding:6px 10px;margin:10px 0;background:var(--c);border-radius:6px}
.qbig{font-size:18px}
.qtog{min-height:48px}
.go:disabled,.sm:disabled{opacity:.55}
/* ---- progression (lot 2B) : cartes de proposition sous le bouton de séance, ligne de jour de repos ---- */
.hero .rest{margin:12px 0 0;font-size:15px;font-weight:600}
.offer{border-left:5px solid var(--a)}
details.det{margin:6px 0}details.det>summary{color:var(--m);font-size:14px}
details.card.det>summary{color:var(--t);font-size:17px;font-weight:700}
.qnames{margin:4px 0;padding-left:20px}.qnames li{margin:3px 0}
.offer h2{margin-bottom:6px}
.offb{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:12px}
.offb .go{margin:0}.offb .sm{min-height:48px}
.li .mv{min-width:44px;min-height:44px;padding:0;font-size:18px;flex:none}
/* ---- notifications (notif.js) : interrupteurs, jours, heures ---- */
.ntg{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.ntg>div{min-width:0}.ntg h2{margin:0}.ntg p{margin:2px 0 0}
.sw2{flex:none;position:relative;width:56px;height:44px;border:0;background:none;padding:0}
.sw2::before{content:"";position:absolute;left:2px;top:9px;width:52px;height:26px;border-radius:13px;background:var(--l);transition:background .15s}
.sw2::after{content:"";position:absolute;left:5px;top:12px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.sw2[aria-checked="true"]::before{background:var(--a)}.sw2[aria-checked="true"]::after{left:31px;background:var(--on)}
@media (prefers-reduced-motion:reduce){.sw2::before,.sw2::after{transition:none}}
.card.off{opacity:.5}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:10px -12px 6px}   /* 7 jours de 44 px à 360 px */
.days .chip{padding:0;min-width:0;min-height:44px;font-weight:700}
.trow{display:flex;align-items:center;gap:10px;margin-top:8px}.trow input{width:auto;min-height:44px;font-size:18px;padding:6px 10px}
.trow span{color:var(--m)}
.nwarn{border-left:5px solid var(--warn)}
.nfull{width:100%;margin-top:8px}

/* ---- refonte, lot 1 (direction B+, 22/10/2026) : polices, boutons, cartes ; accueil, séance, repos, fin de séance ----
   Jetons dans tokens.css. Règles « :root … » : même priorité que l'ancien style qu'elles remplacent. */
body{font-family:var(--ff-text)}
h1,h2,h3,.topbar h1,.qt{font-family:var(--ff-title);font-variation-settings:"opsz" 72}
.topbar h1{font-weight:800;font-stretch:90%;font-size:21px}
:root h2{font-weight:700;font-stretch:92%;font-size:19px;line-height:1.2}
h3{text-transform:none;letter-spacing:0;font-size:16px;font-weight:700;color:var(--t)}
.num,.st b,.tiles b,.wkbig b,.toti b,#tm{font-family:var(--ff-title);font-stretch:85%;font-variant-numeric:tabular-nums lining-nums}
:focus-visible{outline:2px solid var(--t);outline-offset:2px}
:root .card,.card{border-radius:var(--r-card);border:1px solid var(--l);box-shadow:none;padding:16px}
:root .go,.go{border-radius:var(--r-btn);min-height:56px;font-size:18px;font-weight:800;border:2px solid var(--cta-b);box-shadow:none;transition:transform var(--t-fast)}
.sm{border:0;background:var(--f);color:var(--t);border-radius:var(--r-btn);font-weight:700;transition:transform var(--t-fast)}
.go:active,.sm:active,.pm:active,.tick:not([aria-pressed="true"]):active{transform:translateY(var(--press))}
.sm.danger,.danger{background:none;color:var(--danger);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.btn-t{min-height:44px;padding:0 8px;border:0;background:none;color:var(--t);font:inherit;font-size:15px;font-weight:700;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:pointer}
.chip{border:0;background:var(--f)}
input,select,textarea{border-color:var(--l);background:var(--bg)}
.tabbar button{font-size:13px}
:root .tabbar button.on{color:var(--t);font-weight:700}
:root .tabbar button.on .ic{background:none;color:var(--t);box-shadow:none;border-radius:0}
.tabbar button{position:relative}
.tabbar button.on::before{content:"";position:absolute;top:0;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 3px 3px;background:var(--a)}   /* onglet actif : trait court en haut de la barre */
.tag.rec{color:var(--at);border-color:var(--a)}
@media (prefers-reduced-motion:reduce){.go,.sm,.pm,.tick{transition:none}.go:active,.sm:active,.pm:active,.tick:active{transform:none}}

/* signes propres à B : trait de feutre (titre de l'écran seulement), bâtons de comptage, étiquette patine, surlignage (conseil seulement) */
.scrib{display:block;width:150px;height:12px;margin:4px 0 0 2px;color:var(--a)}
.tally{display:inline-flex;gap:4px;vertical-align:-2px}
.tally i{width:3px;height:16px;border-radius:2px;background:var(--ctl);transform:rotate(8deg)}
.tally i.d{background:var(--a)}
.zchip{display:inline-flex;align-items:center;gap:6px;background:var(--pat-bg);color:var(--pat);font-weight:700;font-size:13px;padding:2px 10px 2px 5px;border-radius:999px;margin-top:6px}
.zchip i{width:14px;height:14px;border-radius:50%;background:var(--pat)}

/* accueil */
:root .hero{background:none;border:0;box-shadow:none;color:var(--t);padding:4px 0 8px;margin:0 0 8px;border-radius:0;overflow:visible}
:root .hero .dt{color:var(--m);font-size:15px}
:root .hero h2{font-size:40px;font-weight:800;font-stretch:88%;line-height:1.05;letter-spacing:-.02em;margin:4px 0 0;max-width:none}
:root .hero .sub{color:var(--t);font-size:17px;max-width:none;margin:12px 0 0}
:root .hero .sub+.sub{color:var(--m);font-size:15px;margin-top:0}
:root .hero .go{background:var(--a);color:var(--on);margin-top:16px}
:root .hero .sm.big{width:100%;min-height:56px;font-size:18px;font-weight:800;margin-top:16px}
:root .hero .rest{color:var(--m);font-size:15px;font-weight:400;margin-top:12px}
.card.wk{display:flex;align-items:center;gap:12px}
.wk .wkbig b{font-size:40px;font-weight:800}
.wk .wkl{flex:1;line-height:1.3}
.wk .wkl b{display:block;font-size:17px}
:root .wk .tiles{display:block;margin:0;max-width:96px;text-align:right}
:root .wk .tiles div{border:0;background:none;padding:0;text-align:right}
:root .wk .tiles b{font-size:24px;color:var(--t)}
.idea .zl{font-weight:700;font-size:17px;margin:4px 0 12px}
.idea .row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* séance : mode « un exercice à la fois » */
.fprog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;font-size:15px}
.fprog .tally{margin-left:6px}
.fprog .tally i{height:18px;width:4px}
.warmp{background:var(--s2);border-radius:var(--r-tile);padding:8px 12px;margin:0 0 8px}
.focus .exh{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:center}
.focus .thumb{height:62px;border:0;border-radius:var(--r-tile);background:var(--s2);display:grid;place-items:center;overflow:hidden;position:relative;padding:0;cursor:pointer}
.focus .thumb svg{width:96px;max-width:none}
.focus .thumb::after{content:"";position:absolute;right:5px;bottom:5px;border-left:8px solid var(--t);border-top:5px solid transparent;border-bottom:5px solid transparent;opacity:.7}
.focus .ft{font-family:var(--ff-title);font-size:24px;font-weight:700;font-stretch:92%;line-height:1.1;margin:0}
.focus .fta{font-weight:700;font-size:15px;color:var(--t);margin:2px 0 0}
.focus .fta .tally{margin-right:6px}
.focus .light1{color:var(--pat);font-weight:700;font-size:15px;margin:8px 0 0}
.focus .sug{border:0;padding:0;margin:12px 0 0;font-size:19px;font-weight:800;color:var(--t)}
.sug u{text-decoration:none;background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 2px}   /* surlignage : seulement sur le conseil */
.focus .lastrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.focus .lastrow .last{margin:0;color:var(--m);font-size:15px}
.focus .lastrow details{margin:0}
.focus .frow{min-height:52px}
.focus .frow input{border:0;background:none;text-align:center;font-family:var(--ff-title);font-stretch:85%;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;padding:4px}
.focus .frow.ok input{color:var(--m)}
.focus .frow.act{border:2px solid var(--a);border-radius:16px 16px 16px 4px;padding:8px;margin:4px -6px;background:none}
.focus .frow.act input{font-size:56px;font-weight:800;padding:0;line-height:1.05}
.pm{width:56px;height:56px;min-width:56px;border-radius:50%;border:0;background:var(--f);color:var(--t);font-size:26px;font-weight:700;padding:0;transition:transform var(--t-fast)}
.tick{border:0;background:var(--f);color:var(--ck)}
.tick .tk0{color:var(--ck);opacity:1}
.frow.ok .tick{background:var(--a);color:var(--on)}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.facts .sm{min-height:44px;font-size:16px}
.fnavb{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:8px;padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--l)}
.fnavb button{margin:0;min-height:52px}
.fnavb .prev{width:52px;flex:none;padding:0;font-size:22px}
.fnavb .next{flex:1}
.fnavb .go{font-size:17px}
body.foc main{padding-bottom:110px}
body.foc.rest-on .fnavb{position:static;background:none;border:0;padding:12px 0 0}   /* pendant un repos : « Exercice suivant › » reste accessible (en secondaire), sous l'exercice, au-dessus de la barre de repos */
.feel .feelb{display:grid;gap:8px}
.feel .feelb button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;padding:0 16px;border:0;border-radius:var(--r-btn);background:var(--f);color:var(--t);font:inherit;font-weight:700;font-size:17px}
.feel .feelb button small{display:inline;font-weight:400;font-size:15px;color:var(--t);margin:0}
.feel .feelb button.on{background:var(--a);color:var(--on)}
.feel .feelb button.on small{color:var(--on)}

/* barre de repos : feuille posée sur le contenu ; démonstration de l'exercice suivant après sa dernière série */
.bar{background:var(--c);border:1px solid var(--l);box-shadow:var(--sh-bar)}
.foc .bar{left:0;right:0;bottom:0;border-radius:20px 20px 0 0;border-width:1px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.foc:not(.rest-on) .bar{display:none}
.rb-top b{font-size:var(--fs-timer)}
.bar .pbar{height:4px;background:var(--f)}
.bar .pbar i{background:var(--a)}
.rb-demo{height:150px;margin:8px 0;border-radius:var(--r-tile);background:var(--s2);display:grid;place-items:center;overflow:hidden}
.rb-demo svg.fig{height:146px;width:auto;max-width:100%}
.rb-next b{font-size:17px}
body.foc.rest-on main{padding-bottom:200px}
body.foc.rest-on.demo main{padding-bottom:360px}

/* fenêtre de démonstration (vignette touchée) */
.demo-ov .pr-card{text-align:left;max-width:420px}
.demo-ov svg.fig{background:var(--s2);border-radius:var(--r-tile)}

/* fin de séance */
.fin .dt{color:var(--m);margin:12px 0 0}
.fin h2.big{font-size:40px;font-weight:800;font-stretch:88%;line-height:1.05;letter-spacing:-.02em;margin:4px 0 0}
.fin .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.fin .sum div{background:var(--c);border:1px solid var(--l);border-radius:var(--r-tile);padding:12px 6px;text-align:center}
.fin .sum b{display:block;font-family:var(--ff-title);font-stretch:85%;font-variant-numeric:tabular-nums;font-size:30px;font-weight:800;line-height:1.05}
.fin .sum span{font-size:13px;color:var(--m)}
.fin .rec{display:grid;grid-template-columns:4px 1fr;gap:12px;padding:8px 0}
.fin .rec+.rec{border-top:1px solid var(--l)}
.fin .rec i{background:var(--a);border-radius:2px}
.fin .rec .v{font-family:var(--ff-title);font-stretch:85%;font-size:20px;font-weight:800}
.reward .tok{font-family:var(--ff-title);font-stretch:85%;font-size:36px;font-weight:800;line-height:1;color:var(--pat);margin:8px 0 0}
.reward ul{list-style:none;padding:0;margin:8px 0;font-size:15px}
.reward li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.reward .evo{display:flex;align-items:center;gap:12px;background:var(--pat-bg);border-radius:var(--r-tile);padding:4px 12px 4px 4px;margin:8px 0;color:var(--pat);font-weight:700}
.reward .evo svg{width:64px;height:64px;flex:none}
.reward .bal{display:flex;align-items:center;gap:8px}

<script>
'use strict';
/* ------------------------------------------------------------------ état */
let EX = {}, WO = [], SESS = [], BW = [];
let view = 'accueil', curW = null, F = null;          // F = formulaire de séance en cours
let catQ = '', catArch = false, catG = '', editEx = null;   // catalogue (catG : groupe choisi, '' = tous)
let progW = null, progDraft = null;                  // éditeur de programmes
const VIEWS = [['accueil','Accueil'],['seance','Séance'],['zones','Zones'],['progres','Progrès'],['historique','Historique'],['exercices','Exercices'],['programmes','Programmes'],['jeu','Esprits'],['profil','Mon profil'],['notifications','Notifications'],['donnees','Données']];
const KIND_LABEL = {weight:'Charge × reps', reps:'Reps (lest facultatif)', time:'Durée en secondes', cardio:'Cardio (minutes)'};
const GROUP_ORDER = ['Jambes','Pectoraux','Dos','Épaules','Bras','Abdos et gainage','Cardio'];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const frDate = iso => { const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; };
const num = v => (v === '' || v == null) ? null : +String(v).replace(',', '.');
const fmt = v => v == null || v === '' ? '' : String(+(+v).toPrecision(12)).replace('.', ',');   // sans arrondi : 47,3 reste 47,3 (toPrecision efface seulement les restes de calcul du type 47,800000001)

function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function recall(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

async function api(method, url, data) {
  const r = await fetch(url, {method, headers: data ? {'Content-Type':'application/json'} : {}, body: data ? JSON.stringify(data) : undefined});
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || `Erreur ${r.status}`);
  return j;
}
async function load() {
  const s = await api('GET', '/api/state');
  EX = {}; s.exercises.forEach(e => EX[e.id] = e);
  WO = s.workouts; SESS = s.sessions; BW = s.bodyweight;
}
async function act(fn, okMsg) {
  try { await fn(); await load(); if (okMsg) toast(okMsg); R(); }
  catch (e) { toast(e.message); }
}

/* ------------------------------------------------------------------ outils métier */
function groups() {
  const set = new Set(Object.values(EX).map(e => e.grp));
  return [...GROUP_ORDER.filter(g => set.has(g)), ...[...set].filter(g => !GROUP_ORDER.includes(g)).sort()];
}
function unit(e) { return e.kind === 'time' ? 's' : e.kind === 'cardio' ? 'min' : 'reps'; }
function target(e) {
  const r = e.target_min && e.target_max && e.target_min !== e.target_max ? `${e.target_min}-${e.target_max}` : (e.target_max || e.target_min || '?');
  if (e.kind === 'cardio') return `${r} min`;
  return `${e.sets} × ${r}${e.kind === 'time' ? ' s' : ''}${e.per_side ? ' / côté' : ''}`;
}
const targetLine = e => target(e) + (e.rest && e.kind !== 'cardio' ? ` · repos ${e.rest} s` : '');   // « 3 × 10-12 · repos 90 s »
const ITEM_KEYS = ['sets', 'target_min', 'target_max', 'rest'];
function exIn(e, w) {   // l'exercice avec les réglages propres au programme w (séries, cible, repos), s'il en a ; own = réglage du programme
  const s = e && w && w.settings && w.settings[e.id]; if (!s) return e;
  const o = Object.assign({}, e, {own: true}); ITEM_KEYS.forEach(k => { if (s[k] != null) o[k] = s[k]; }); return o;
}
function exF(id) { return exIn(EX[id], F && F.wid ? WO.find(w => w.id === F.wid) : null); }   // exercice tel que réglé pour la séance en cours
const ownTag = e => e.own ? '<span class="tag">propre à ce programme</span>' : '';
function inputLabels(e) {
  return {weight: [e.assisted ? 'assist. kg' : 'kg', 'reps'], reps: ['lest kg', 'reps'], time: ['lest kg', 'secondes'], cardio: ['niveau', 'minutes']}[e.kind];
}
function setsOf(s, exId) { const x = s.entries.find(e => e.exercise_id === exId); return x ? x.sets : null; }
function refSessions(exId, wid, exceptSid) {   // séances qui contiennent l'exercice, de la plus récente à la plus ancienne : celles du même programme s'il y en a
  const all = SESS.filter(s => s.id !== exceptSid && setsOf(s, exId)).reverse(), same = wid ? all.filter(s => s.workout_id === wid) : [];
  return same.length ? same : all;
}
/* ressenti, noté 1 à 5 dans les données (inchangé). L'écran propose 3 choix : Facile = 2, Juste bien = 3, Dur = 4 ;
   les anciennes notes 1 (« très facile ») et 5 (« à fond ») se lisent Facile et Dur. */
const FEEL = [[2, 'Facile'], [3, 'Juste bien'], [4, 'Dur']];
const effLabel = n => n <= 2 ? 'Facile' : n === 3 ? 'Juste bien' : 'Dur';
function effBox(e) {   // une fois, juste après la dernière série validée (toujours en modification d'une séance passée) ; ensuite une ligne
  if (e.kind === 'cardio') return '';
  const v = (F.eff && F.eff[e.id]) || 0, rows = F.vals[e.id] || [], d = (F.dn && F.dn[e.id]) || [];
  if (v && F.effOpen !== e.id) return `<p class="feel1">Ressenti\u00a0: <b>${effLabel(v)}</b><button class="sm" onclick="F.effOpen=${e.id};R()">Changer</button></p>`;
  if (F.mode !== 'edit' && F.effOpen !== e.id && !(rows.length && rows.every((_, k) => d[k]))) return '';
  const nx = F.mode === 'new' ? feelNext(e) : null;
  return `<div class="feel" role="group" aria-label="Ressenti"><p><b>Comment c’était\u00a0?</b></p><div class="feelb">${FEEL.map(([n, t]) => `<button class="${v === n ? 'on' : ''}" aria-pressed="${v === n}" onclick="setEff(${e.id},${n})">${t}${nx ? `<small>${esc(feelTxt(nx[n]))}</small>` : ''}</button>`).join('')}</div></div>`;
}
/* conséquence de chaque choix sur le conseil de la prochaine séance de ce programme : loadTip appliqué à l'historique
   complété par la séance en cours (séries saisies, ressenti essayé). Rien ne change le conseil d'ici là sans une action de l'utilisateur
   (semaine légère, reprise et phase demandent « Accepter ») ; null pendant une semaine légère ou une reprise, qui peut finir avant. */
function feelNext(e) {
  const cs = window.PROFIL && PROFIL.coach ? PROFIL.coach() : {};
  if (cs.light) return null;
  const sets = (F.vals[e.id] || []).map(a => [num(a[0]), num(a[1])].map(x => x == null || isNaN(x) ? null : x)).filter(a => a[0] != null || a[1] != null);
  if (!sets.length) return null;
  let ref = refSessions(e.id, F.wid, F.sid);
  if (F.wid && ref.length && ref[0].workout_id !== F.wid) ref = [];   // la prochaine fois, la référence sera cette séance du programme
  return Object.fromEntries(FEEL.map(([n]) => [n, loadTip(e, [{id: 0, day: F.day, workout_id: F.wid, entries: [{exercise_id: e.id, sets, effort: n}]}, ...ref], cs, n)[0]]));
}
const feelTxt = t => /^garde /.test(t) ? 'on ' + t : 'ensuite ' + t;   // « ensuite 50 kg × 10 », « on garde 47,5 kg »
function setEff(id, n) { syncForm(); F.eff = F.eff || {}; F.eff[id] = n; F.effOpen = null; F.dirty = true; syncForm(); R(); }
function sessionVolume(s) {
  let v = 0;
  s.entries.forEach(en => { const e = EX[en.exercise_id]; if (e && e.kind === 'weight' && !e.assisted) en.sets.forEach(a => v += (a[0] || 0) * (a[1] || 0)); });
  return v;
}
function weekStart() { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }
function dayDate(iso) { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
function setText(e, a) {
  const [l, v] = a;

/* ------------------------------------------------------------------ Zones : carte de chaleur de la semaine */
let ZMODE = 'pick', ZINFO = '', ZST = {sets: {}, last: {}};
function zoneStats() {
  const since = new Date(); since.setHours(0, 0, 0, 0); since.setDate(since.getDate() - 6);
  const sets = {}, last = {};
  const mark = (z, d, n) => { if (!last[z] || d > last[z]) last[z] = d; if (d >= since) sets[z] = (sets[z] || 0) + n; };
  SESS.forEach(ss => { const d = dayDate(ss.day); ss.entries.forEach(en => {
    const e = EX[en.exercise_id]; if (!e || e.kind === 'cardio') return;
    const zz = zonesOf(e); zz.p.forEach(z => mark(z, d, en.sets.length)); zz.s.forEach(z => mark(z, d, en.sets.length * 0.5));
  }); });
  return {sets, last};
}
function daysSince(z, st) { if (!st.last[z]) return null; const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((t - st.last[z]) / 864e5); }
function zInfo(k) {
  const n = Math.round((ZST.sets[k] || 0) * 10) / 10, d = daysSince(k, ZST);
  ZINFO = `${ZL[k]}\u00a0: ${fmt(n)} série${n > 1 ? 's' : ''} sur 7 jours, ` + (d === null ? 'jamais travaillée.' : d === 0 ? "travaillée aujourd'hui." : `dernière fois il y a ${d} jour${d > 1 ? 's' : ''}.`);
  R();
}
function suggestZones() {
  const st = zoneStats();
  const pick = ZONES.map(([k]) => k).filter(k => zCount(k) > 0)
    .map(k => ({k, d: daysSince(k, st) ?? 999, r: Math.random()})).sort((a, b) => (b.d - a.d) || (a.r - b.r)).slice(0, 3);
  ZSEL = new Set(pick.map(x => x.k)); store('muscu-zones', [...ZSEL]); ZMODE = 'pick';
  toast('Zones les moins travaillées : ' + pick.map(x => ZL[x.k]).join(', ') + '. Ajuste puis génère.');
  R();
}

/* ------------------------------------------------------------------ lignes de séries
   La première série pas encore validée a des boutons − et + de 48 px (seulement en mode « un exercice à la fois ») ;
   chaque champ reste modifiable au clavier, avec une virgule ou un point, sans arrondi. ✓ valide la série et lance le repos. */

    if (i !== act) return `<div class="frow${dn[i] ? ' ok' : ''}${ticks ? '' : ' nt'}"><span>${lab}</span>${iu('l', l1, a[0], u1)}${iu('v', l2, a[1], u2)}${tick}</div>`;
    const st = (k, ph, v, d) => `<div class="stp"><div class="stpr"><button class="pm" data-in="v${e.id}_${i}${k}" data-d="${-d}" aria-label="Moins ${fmt(d)}, ${ph}${sn}">−</button>${inp(k, ph, v)}<button class="pm" data-in="v${e.id}_${i}${k}" data-d="${d}" aria-label="Plus ${fmt(d)}, ${ph}${sn}">+</button></div><b class="u" aria-hidden="true">${ph}</b></div>`;   // unité sous le chiffre

/* − et + : un appui = un pas ; un appui long répète (après 0,4 s, toutes les 0,1 s). Le champ est modifié sur place, sans redessiner l'écran. */

function rowsFor(e) {

  const src = F.mode === 'new' ? tipSets(e, F.wid) : null;   // conseil de charge s'il y en a un, sinon la dernière fois
  const n = e.kind === 'cardio' ? 1 : Math.max(e.sets, src ? src.length : 0);
  const rows = [];
  for (let i = 0; i < n; i++) rows.push(src && src[i] ? [src[i][0] ?? '', src[i][1] ?? ''] : ['', '']);
  return rows;
}
function syncForm() {
  // relit le DOM vers F, puis sauvegarde le brouillon
  F.ids.forEach(id => {
    if (!$(`v${id}_0l`)) return;   // exercice non affiché (mode focus) : on garde ses valeurs
    const e = exF(id); const rows = rowsFor(e);
    F.vals[id] = rows.map((_, i) => [($(`v${id}_${i}l`) || {}).value ?? '', ($(`v${id}_${i}v`) || {}).value ?? '']);
  });
  if ($('f-day')) F.day = $('f-day').value;
  if ($('f-notes')) F.notes = $('f-notes').value;

function addRow(id) { syncForm(); F.vals[id].push(['', '']); R(); }
function delRow(id) { syncForm(); if (F.vals[id].length > 1) F.vals[id].pop(); R(); }

function removeFromForm(id) { F.dirty = true; syncForm(); F.ids = F.ids.filter(x => x !== id); delete F.vals[id]; R(); }

function statsHeader() {

function exCard(e) {   // un exercice dans l'Aperçu (ou en modification d'une séance passée) : vignette fixe, séries, ✓
  const rows = rowsFor(e); F.vals[e.id] = rows;
  const nw = F.mode === 'new';
  let h = `<div class="card"><div class="aph"${nw ? ` onclick="focusAt(${e.id})"` : ''}><div class="th">${diagram(e, false)}</div><div><h2>${esc(e.name)}</h2><b>${esc(targetLine(e))}</b></div></div>`;
  h += advice(e, F.sid, F.wid);
  h += setRows(e, rows, false);
  h += effBox(e);
  h += `<div class="acts">`;
  if (nw) h += `<button class="sm" onclick="focusAt(${e.id})">Faire cet exercice</button>`;
  if (e.kind !== 'cardio') h += `<button class="sm" onclick="addRow(${e.id})">+ série</button><button class="sm" onclick="delRow(${e.id})">− série</button>`;
  h += `<button class="sm" onclick="removeFromForm(${e.id})">Retirer aujourd'hui</button></div></div>`;

}

function exOptions(exclude = []) {
  return groups().map(g => {
    const list = Object.values(EX).filter(e => e.grp === g && !e.archived && !exclude.includes(e.id)).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    return list.length ? `<optgroup label="${esc(g)}">${list.map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}</optgroup>` : '';
  }).join('');
}

async function saveSession() {
  syncForm();
  const entries = F.ids.filter(i => EX[i]).map(id => ({exercise_id: id,
    sets: (F.vals[id] || []).map(a => [num(a[0]), num(a[1])]).filter(a => a[0] != null || a[1] != null), effort: (F.eff && F.eff[id]) || null}))
    .filter(e => e.sets.length);
  if (!entries.length) return toast('Aucune série saisie');
  const payload = {workout_id: F.wid, workout_name: F.wname, day: F.day, notes: F.notes, entries};
  const editing = F.mode === 'edit';
  if (!editing) { const live = F.t0 && F.day === today(); payload.start_ts = live ? F.t0 : null; payload.end_ts = live ? Date.now() : null; }   // saisie après coup (autre date) : pas de durée
  const nBefore = SESS.length, esid = editing ? F.sid : null;
  await act(async () => {
    if (editing) await api('PUT', `/api/sessions/${F.sid}`, payload);
    else await api('POST', '/api/sessions', payload);
    FOC = null;
    store(draftKey());
    if (F.xid) { XS = XS.filter(x => x.xid !== F.xid); saveXS(); store('muscu-xcur', undefined); }
    F = null;
    if (editing) { view = 'historique'; HDET = esid; }   // retour au détail de la séance modifiée
  }, editing ? 'Séance modifiée' : '');
  if (!editing && SESS.length > nBefore) {
    const ns = SESS.reduce((a, b) => b.ts > a.ts ? b : a), P = computePRs(), pr = P.bySession[ns.id] || [];
    const rep = window.JEU ? JEU.award(ns.id) : null;   // crédité même si l'onglet Esprits est masqué ; affiché seulement s'il ne l'est pas
    FIN = {sid: ns.id, pr, gains: P.gains[ns.id] || [], rep: rep && !JEU.hidden() ? rep : null}; view = 'fin'; R();
    if (pr.length) celebrate(pr);
  }
  window.scrollTo(0, 0);
}
function editSession(sid) {
  const s = SESS.find(x => x.id === sid); if (!s) return;
  if (F && F.mode === 'new' && hasValues()) store(draftKey(), F);   // garde le brouillon en cours
  F = {mode: 'edit', sid, wid: s.workout_id, wname: s.workout_name, day: s.day, notes: s.notes,
       ids: s.entries.map(e => e.exercise_id), vals: {}};
  s.entries.forEach(e => F.vals[e.exercise_id] = e.sets.map(a => [a[0] ?? '', a[1] ?? '']));
  F.eff = {}; s.entries.forEach(e => { if (e.effort) F.eff[e.exercise_id] = e.effort; });

}
function cancelEdit() { const sid = F && F.sid; F = null; if (sid == null) return go('historique'); view = 'historique'; HDET = sid; store('muscu-view', view); R(); window.scrollTo(0, 0); }   // retour au détail (HBACK et HSCROLL gardés)

function vHisto() {

  Object.entries(months).forEach(([m, l]) => {
    h += `<h2 class="mon">${capF(dayDate(m + '-01').toLocaleDateString('fr-FR', {month: 'long', year: 'numeric'}))} · ${l.length} séance${l.length > 1 ? 's' : ''}</h2><div class="hlist">`

  let h = `<div class="sd"><section><p class="dt">${esc(capF(dLong(s.day)))}</p><h1 class="title">${esc(s.workout_name)}</h1>${scribSvg(140)}${sumTiles(s)}</section>`;
  if (recs.length) h += `<section class="card"><h2>${recs.length > 1 ? recs.length + ' records battus' : 'Record battu'}</h2>`
    + recs.map(r => `<div class="recl"><i></i><div><b>${esc(r.ex.name)}</b><div class="v">${esc(recTxt(r.ex, r.set))}</div>${r.prev ? `<span class="m">${esc(recAvant(r))}</span>` : ''}</div></div>`).join('') + '</section>';

const KIND_DESC = {weight:'Saisie : charge et répétitions.', reps:'Saisie : répétitions (poids du corps).', time:'Saisie : durée de chaque série.', cardio:'Saisie : durée en minutes.'};

let ZDET = null, viewEx = null;
function openEx(id) { viewEx = id; R(); window.scrollTo(0, 0); }
function closeEx() { viewEx = null; R(); window.scrollTo(0, 0); }
function catOrder() {   // même ordre et mêmes filtres que la liste affichée
  const ok = catMatch();
  return groups().flatMap(g => Object.values(EX).filter(e => e.grp === g && ok(e)).sort((a, b) => a.archived - b.archived || a.name.localeCompare(b.name, 'fr'))).map(e => e.id);
}
function stepEx(d) {
  const ids = catOrder(), i = ids.indexOf(viewEx), j = i + d;
  if (i < 0 || j < 0 || j >= ids.length) return;
  viewEx = ids[j]; R(); window.scrollTo(0, 0);
}
function addExToSession(id) {

const I3 = {
  plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>', up: '<path d="M12 19V5M6 11l6-6 6 6"/>', dn: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  srch: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>', pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  down: '<path d="M6 9l6 6 6-6"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>', check: '<path d="M4 13c2 1 4 3 5 5 3-6 7-10 11-12"/>',
  trash: '<path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13"/>'
};
const ico3 = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${I3[k]}</svg>`;
const det3 = (body, lab = 'Détails') => body ? `<details class="det"><summary>${lab}</summary><div>${body}</div></details>` : '';
/* − valeur + : fn reçoit −1 ou +1 ; id : la valeur affichée, mise à jour sans redessiner l'écran (le nom en cours de saisie reste) */
const stepper = (lab, v, u, fn, id, aria) => `<div class="frow"><span>${lab}</span><div class="step"><button class="pm" onclick="${fn}(-1)" aria-label="${aria[0]}">${ico3('minus')}</button><b class="v num" id="${id}">${v}${u ? `<small>${u}</small>` : ''}</b><button class="pm" onclick="${fn}(1)" aria-label="${aria[1]}">${ico3('plus')}</button></div></div>`;
const swRow = (lab, on, fn, id) => `<button class="swrow" role="switch" aria-checked="${!!on}" onclick="${fn}"${id ? ` id="${id}"` : ''}><span>${lab}</span><i class="sw" aria-hidden="true"></i></button>`;
function swFlip(el) { const on = el.getAttribute('aria-checked') !== 'true'; el.setAttribute('aria-checked', on); return on; }
/* séance en cours : séance commencée (« Démarrer la séance »), séries saisies, séance par zones ou séance passée en modification */
function inSession() { return pendingDraft() || !!(F && (F.mode === 'edit' || F.t0 || F.dirty)); }

function vExDetail() {
  const e = EX[viewEx]; if (!e) { viewEx = null; return vCat(); }
  const z = zonesOf(e), info = EXINFO[e.slug], zl = a => a.map(k => ZL[k]).join(', ');
  ZDET = {p: z.p, s: z.s}; const bodies = bodySvg('front') + bodySvg('back'); ZDET = null;
  const hist = SESS.filter(s => setsOf(s, e.id));
  const sub = [info ? info.n : '', e.assisted ? 'Machine à assistance' : ''].filter(Boolean).join(' · ');
  let h = `<div class="l3 exd"><div class="big">${diagram(e, true)}</div>`;
  h += `<section>${z.p.length ? `<span class="zchip"><i></i>${esc(zl(z.p))}</span>` : ''}<h1 class="title" style="font-size:30px">${esc(e.name)}</h1>${scribSvg(140)}
    <p class="presc">${esc(targetLine(e))}</p>${sub ? `<p class="m">${esc(sub)}</p>` : ''}${e.focus ? `<p class="m">${esc(e.focus)}</p>` : ''}</section>`;
  h += `<button class="btn btn-s w" style="margin-top:12px" onclick="addExToSession(${e.id})">${inSession() ? 'Ajouter à ma séance en cours' : 'Démarrer une séance avec cet exercice'}</button>`;
  if (info) {
    h += `<section class="card"><h2>Comment le faire</h2><ol class="steps">${info.s.map(x => `<li>${esc(x)}</li>`).join('')}</ol>${det3(`<p class="m">${esc(KIND_DESC[e.kind] || '')} Touche le schéma pour mettre l’animation en pause.</p>`)}</section>`;
    h += `<section class="card"><h2>Erreurs fréquentes</h2><ul class="errs">${info.e.map(x => `<li>${esc(x)}</li>`).join('')}</ul><p class="keep">${esc(info.c)}</p></section>`;
  }
  h += `<section class="card"><h2>Muscles travaillés</h2><div class="bodies det">${bodies}</div>`
    + (z.p.length ? `<div class="zleg"><span><i></i>${esc(zl(z.p))}</span>${z.s.length ? `<span><i class="s"></i>${esc(zl(z.s))}</span>` : ''}</div>` : '')
    + (e.kind === 'cardio' ? '<p class="m">Surtout le cœur et le souffle.</p>' : '') + '</section>';
  if (!info || e.tip) h += `<section class="card"><h2>${info ? 'Ton astuce' : 'Notes'}</h2>${e.tip ? `<p>${esc(e.tip)}</p>` : '<p class="m">Ajoute une astuce avec « Modifier ».</p>'}</section>`;
  h += '<section class="card"><h2>Tes chiffres</h2>';
  if (!hist.length) h += '<p class="m">Tes chiffres apparaîtront après ta première séance.</p>';
  else {
    let bestSet = null, bestScore = null;
    hist.forEach(s => { const b = bestOf(e, setsOf(s, e.id)); if (b && (bestScore == null || b.score > bestScore)) { bestScore = b.score; bestSet = b.set; } });
    const last = hist[hist.length - 1].day, d = dayDate(last).toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'});
    const top = e.kind === 'weight' ? (() => { const l = hist.flatMap(s => setsOf(s, e.id)).map(a => a[0]).filter(v => v != null); return l.length ? [fmt(e.assisted ? Math.min(...l) : Math.max(...l)), e.assisted ? 'kg d’assistance' : 'kg au plus'] : null; })() : null;
    const best = top || (bestSet ? [fmt(bestSet[1]), {reps: 'reps au mieux', time: 's au mieux', cardio: 'min au mieux'}[e.kind] || ''] : null);
    h += `<div class="sum"><div><b>${hist.length}</b><span>séance${hist.length > 1 ? 's' : ''}</span></div>${best ? `<div><b>${best[0]}</b><span>${best[1]}</span></div>` : ''}<div><b>${esc(d.replace(/\.$/, '.'))}</b><span>dernière</span></div></div>`;
    h += advice(e, null).replace(/<svg[\s\S]*?<\/svg>/g, "");
    const sr = exSeries(e), lab = e.kind === 'weight' ? (e.assisted ? 'Assistance' : 'Charge max') : e.kind === 'cardio' ? 'Minutes' : e.kind === 'time' ? 'Durée (s)' : 'Meilleure série (reps)';
    h += chart([...(sr.rm.length ? [{pts: sr.rm, c: 'l2'}] : []), {pts: sr.pts, c: 'l1', dot: 'p1'}], {label: `${e.name} : ${lab}`, int: e.kind !== 'weight', few: 'Il faut au moins 2 séances pour tracer une courbe.'})
      + (sr.pts.length > 1 ? `<div class="leg"><span><i></i>${lab}</span>${sr.rm.length ? '<span><i class="est"></i>1RM estimé (≈)</span>' : ''}</div>` : '')
      + det3(bestSet ? `<p>Meilleure série${NB}: ${esc(setText(e, bestSet))}</p>` + (sr.rm.length ? '<p class="m">1RM : charge que tu pourrais soulever une fois, estimée à partir de tes séries.</p>' : '') : '');
  }
  h += '</section>';
  const progs = WO.filter(w => w.items.includes(e.id));
  h += `<section class="card"><h2>Dans tes programmes</h2>${progs.length ? progs.map(w => `<div class="lrow" style="cursor:default"><div class="d"><b>${esc(w.name)}</b><span class="num">${esc(targetLine(exIn(e, w)))}</span></div></div>`).join('') : '<p class="m">Dans aucun programme.</p>'}</section>`;
  const ids = catOrder(), i = ids.indexOf(e.id), pv = EX[ids[i - 1]], nx = EX[ids[i + 1]];
  h += `<div class="pn"><button class="btn btn-s" onclick="stepEx(-1)" ${i > 0 ? '' : 'disabled'}>‹ Précédent<small>${pv ? esc(pv.name) : ''}</small></button><button class="btn btn-s" onclick="stepEx(1)" ${nx ? '' : 'disabled'}>Suivant ›<small>${nx ? esc(nx.name) : ''}</small></button></div>`;
  return h + '</div>';
}

function vCat() {

  if (viewEx) return vExDetail();
  const g = groups();
  return `<div class="l3"><h1 class="title">Tes exercices</h1>${scribSvg(130)}
    <div style="display:flex;gap:8px;margin-top:16px"><div class="srch">${ico3('srch')}<input id="q" class="inp" type="search" placeholder="Rechercher" aria-label="Rechercher un exercice" value="${esc(catQ)}" oninput="catQ=this.value;listCat()"></div><button class="btn btn-s" onclick="editOpen(null)" aria-label="Nouvel exercice">${ico3('plus')}Nouveau</button></div>
    <div class="scroller" style="margin-top:12px" role="group" aria-label="Groupe">${['', ...g].map(x => `<button class="chip" aria-pressed="${catG === x}" onclick="catG=${esc(JSON.stringify(x))};R()">${x ? esc(x) : 'Tous'}</button>`).join('')}</div>
    <div id="catlist">${catList()}</div>
    <button class="btn-t" style="margin-top:12px" onclick="catArch=!catArch;R()">${catArch ? 'Masquer les exercices archivés' : 'Afficher les exercices archivés'}</button></div>`;
}
function listCat() { $('catlist').innerHTML = catList(); }
function catMatch() {   // même filtre pour la liste et pour Précédent / Suivant de la fiche
  const q = catQ.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  return e => (catArch || !e.archived) && (!catG || e.grp === catG) && (!q || (e.name + ' ' + e.focus + ' ' + e.grp).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q));
}
function catList() {
  const ok = catMatch();
  let h = '';
  groups().forEach(g => {
    const list = Object.values(EX).filter(e => e.grp === g && ok(e)).sort((a, b) => a.archived - b.archived || a.name.localeCompare(b.name, 'fr'));

    const r = await api('POST', '/api/import', o);
    F = null; progDraft = null; store(draftKey());
    if (window.PROFIL) PROFIL.afterImport(o);   // import réussi : le questionnaire saute (un import annulé ou refusé n'arrive jamais ici)
    if (imposed) { view = 'accueil'; store('muscu-view', view); }
    alert('Import terminé\u00a0: ' + Object.entries(r).map(([k, v]) => `${k}\u00a0: ${v}`).join(', '));
  });
}

/* ------------------------------------------------------------------ minuteur */
/* Le minuteur est une barre en bas de l'écran, visible sur tous les onglets pendant un repos :
   grand compte à rebours, −15 s, +15 s, Passer, autre durée, et la série suivante. Hors repos, sur l'onglet Séance seulement. */
let T = 0, TI, TEND = 0, TDUR = 0, TMID = null, TMO = false, BARX = false;   // BARX : minuteur agrandi d'un toucher hors de l'onglet Séance
const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function tk() {
  const s = Math.max(T, 0), m = $('tm'), p = $('tmp');
  if (m) m.textContent = mmss(s);
  if (p) p.style.width = (TDUR ? Math.min(100, s * 1000 / TDUR * 100) : 0) + '%';
}
function ring() {
  vib([300, 100, 300]);
  try { const c = new AudioContext(), o = c.createOscillator(); c.resume && c.resume(); o.connect(c.destination); o.start(); o.stop(c.currentTime + .4); } catch (e) {}
}
function tmStore() { store('muscu-timer', TEND || undefined); store('muscu-timer-i', TEND ? {d: TDUR, id: TMID} : undefined); }
function tkNow() {   // le temps restant se calcule sur l'heure réelle : il reste juste si le téléphone se verrouille ou si on change d'appli
  if (!TEND) return;
  T = Math.max(0, Math.ceil((TEND - Date.now()) / 1000)); tk();
  if (T <= 0) {
    const late = Date.now() - TEND;
    clearInterval(TI); TEND = 0; tmStore();
    if (late < 20000) { ring(); toast('Repos terminé'); }
    barRender(); screenSync();
  }
}
function TM(s, id) {
  clearInterval(TI); TDUR = s * 1000; TEND = Date.now() + TDUR; TMID = id ?? curExId(); TMO = false; tmStore();
  barRender(); tkNow(); screenSync();
  TI = setInterval(tkNow, 250);
  if (window.NOTIF) NOTIF.rest(s, nextSet(TMID));   // fin du repos, écran verrouillé (appli Android, si activée)
}
function TMadd(d) {   // −15 s ou +15 s ; à zéro, le repos s'arrête sans sonner
  if (!TEND) return;
  TEND += d * 1000; TDUR = Math.max(1000, TDUR + d * 1000);
  if (TEND <= Date.now() + 500) return TMskip();
  tmStore(); tkNow();
  if (window.NOTIF) NOTIF.rest(T, nextSet(TMID));
}
function TMskip() {
  clearInterval(TI); TEND = 0; T = 0; TMO = false; tmStore();
  if (window.NOTIF) NOTIF.rest(0);
  barRender(); screenSync();
}
function TMmore() { TMO = !TMO; barRender(); }
function curExId() { if (!F || !inFocus()) return null; const ids = F.ids.filter(i => EX[i]); return ids[Math.min(FOC ?? firstUndone(), ids.length - 1)] ?? null; }
function nextInfo(id) {   // [« Presse à cuisses », « série 2 sur 3 · 47,5 kg × 10 »] ; nom seulement si l'exercice change
  if (!F) return null;
  const ids = F.ids.filter(i => EX[i]), st = id != null ? Math.max(0, ids.indexOf(id)) : FOC != null ? FOC : 0;
  for (const i of ids.slice(st)) {
    const e = exF(i), rows = F.vals[i] || rowsFor(e), d = (F.dn && F.dn[i]) || [], k = rows.findIndex((_, j) => !d[j]);
    if (k < 0) continue;
    const a = [num(rows[k][0]), num(rows[k][1])].map(x => x == null || isNaN(x) ? null : x);
    return [i === id ? '' : e.name, `série ${k + 1} sur ${rows.length}${a[1] != null ? ' · ' + setText(e, a) : ''}`];
  }
  return null;
}
function barRender() {
  const b = document.querySelector('.bar'); if (!b) return;
  if (!TEND) BARX = false;
  const away = view !== 'seance', compact = !!TEND && away && !BARX;   // hors de l'onglet Séance : une ligne (temps restant, Passer), agrandie au toucher
  document.body.classList.toggle('rest-on', !!TEND); document.body.classList.toggle('barc', compact);
  const nb = document.querySelector('.fnavb .next[data-all]'); if (nb) nb.className = (TEND ? 'sm' : 'go') + ' next';   // exercice fini : orange seulement hors repos
  if (compact) {
    b.innerHTML = `<div class="rb-c"><button class="rb-cx" onclick="BARX=true;barRender()" aria-expanded="false" aria-label="Agrandir le minuteur de repos"><span class="m">Repos</span><b id="tm" role="timer" aria-live="off">${mmss(Math.max(T, 0))}</b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><button class="sm" onclick="TMskip()">Passer</button></div>`;
    return tk();
  }
  const more = TMO ? `<div class="rb-more">${[60, 90, 120].map(x => `<button class="sm" onclick="TM(${x}, TMID)">${x < 120 ? x + ' s' : '2 min'}</button>`).join('')}</div>` : '';
  document.body.classList.remove('demo');
  if (TEND) {
    const nx = nextInfo(TMID), dm = !away && inFocus() ? demoNext(TMID) : null;
    if (dm) document.body.classList.add('demo');
    // ordre des maquettes : « Repos », temps, Passer ; barre ; (démonstration et « Ensuite » ;) −15 s, +15 s, « Autre durée » en lien
    const btns = `<div class="rb-btn"><button class="sm" onclick="TMadd(-15)" aria-label="Moins 15 secondes">−15 s</button><button class="sm" onclick="TMadd(15)" aria-label="Plus 15 secondes">+15 s</button><button class="btn-t" onclick="TMmore()" aria-expanded="${TMO}">Autre durée</button></div>` + more;
    const next = nx ? `<p class="rb-next">Ensuite\u00a0: <b>${esc(nx[0] || nx[1])}</b>${nx[0] ? `<span>${esc(nx[1])}</span>` : ''}</p>` : '';
    b.innerHTML = `<div class="rb-top">${away ? '<button class="sm rb-red" onclick="BARX=false;barRender()" aria-expanded="true" aria-label="Réduire le minuteur de repos">Réduire</button>' : '<span class="m">Repos</span>'}<b id="tm" role="timer" aria-live="off">${mmss(Math.max(T, 0))}</b><button class="sm" onclick="TMskip()">Passer</button></div>`
      + `<div class="pbar"><i id="tmp"></i></div>`
      + (dm ? `<div class="rb-demo">${diagram(dm, true)}</div>` + next + btns : btns + next);
    tk();
  } else {
    const id = curExId(), e = id != null ? exF(id) : null, d = e && e.rest && e.kind !== 'cardio' ? e.rest : 90;
    b.innerHTML = `<div class="rb-idle"><span class="m">Repos</span><button class="sm" onclick="TM(${d}, curExId())">Lancer · ${d < 120 || d % 60 ? d + ' s' : d / 60 + ' min'}</button><button class="sm" onclick="TMmore()" aria-expanded="${TMO}">Autre durée</button></div>` + more;
  }
}
/* repos qui suit la dernière série d'un exercice : l'exercice suivant, montré en grand dans la barre de repos (image fixe si mouvement réduit) */
function demoNext(id) {
  if (!F || id == null) return null;
  const ids = F.ids.filter(i => EX[i]), k = ids.indexOf(id); if (k < 0 || k >= ids.length - 1) return null;
  const rows = F.vals[id] || rowsFor(exF(id)), d = (F.dn && F.dn[id]) || [];
  if (!rows.length || !rows.every((_, j) => d[j])) return null;
  const e = exF(ids[k + 1]); return diagram(e, false) ? e : null;
}
function nextSet(id) {   // « Prochaine série : Développé couché, série 3 sur 4. » : première série non validée, à partir de l'exercice en cours
  if (!F) return null;
  const ids = F.ids.filter(i => EX[i]), st = id != null ? Math.max(0, ids.indexOf(id)) : FOC != null ? FOC : 0;
  for (const i of ids.slice(st)) {
    const rows = F.vals[i] || rowsFor(exF(i)), d = (F.dn && F.dn[i]) || [], k = rows.findIndex((_, j) => !d[j]);
    if (k >= 0) return `Prochaine série\u00a0: ${EX[i].name}, série ${k + 1} sur ${rows.length}.`;
  }
  return null;
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) tkNow(); SCRON = null; screenSync(); });
(function () {   // minuteur en cours quand la page a été rechargée ou fermée par le système
  const te = +recall('muscu-timer') || 0, inf = recall('muscu-timer-i') || {};
  if (te > Date.now()) { TEND = te; TDUR = inf.d || Math.max(1000, te - Date.now()); TMID = inf.id ?? null; tkNow(); TI = setInterval(tkNow, 250); }
  else { store('muscu-timer', undefined); store('muscu-timer-i', undefined); }
})();

/* ------------------------------------------------------------------ écran allumé pendant la séance
   En mode « un exercice à la fois » et pendant un repos ; réglage du menu, activé par défaut.
   Appli Android : la coque pose FLAG_KEEP_SCREEN_ON (FonteApp.keepScreenOn). Navigateur : Screen Wake Lock, s'il existe. */
function screenSync() {
  const on = SCREEN && !document.hidden && (!!TEND || inFocus());
  if (on === SCRON) return; SCRON = on;
  try { if (window.FonteApp && typeof window.FonteApp.keepScreenOn === 'function') { window.FonteApp.keepScreenOn(on); return; } } catch (e) {}
  try {
    if (on && navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { if (SCRON) WAKE = l; else l.release(); }).catch(() => {});
    else if (!on && WAKE) { WAKE.release(); WAKE = null; }
  } catch (e) {}
}
function tabsPick() {   // l'onglet Esprits dans la barre du bas : l'interrupteur lit toujours l'état du jeu
  const el = $('dtabs'); if (!el) return;
  if (!window.JEU) { el.innerHTML = ''; return; }
  const on = jeuOn();
  el.innerHTML = `<div class="ntg"><div><p class="m">Onglets</p><b>Afficher l’onglet Esprits dans la barre du bas</b></div><button class="sw2" role="switch" aria-checked="${on}" aria-label="Afficher l’onglet Esprits dans la barre du bas" onclick="JEU.setHidden(${on});tabsPick()"></button></div>`;
}
function setVib(on) { VIB = on; store('muscu-vibration', on); vibPick(); }
function vibPick() {
  const el = $('dvib'); if (!el) return;
  el.innerHTML = `<div class="ntg"><div><p class="m">Toute l’appli</p><b>Vibrations</b></div><button class="sw2" role="switch" aria-checked="${VIB}" aria-label="Vibrations" onclick="setVib(${!VIB})"></button></div>`;
}
function setScreen(on) { SCREEN = on; store('muscu-ecran', on); SCRON = null; screenSync(); screenPick(); }
function screenPick() {
  const el = $('dscreen'); if (!el) return;
  el.innerHTML = `<div class="ntg"><div><p class="m">Pendant la séance</p><b>Garder l’écran allumé</b></div><button class="sw2" role="switch" aria-checked="${SCREEN}" aria-label="Garder l’écran allumé pendant la séance" onclick="setScreen(${!SCREEN})"></button></div>`;
}


/* ------------------------------------------------------------------ photos de progression (stockées localement uniquement) */
let PH = null;
async function loadPhotos() {
  try { const r = await fetch('/api/photos'); if (r.ok) { PH = await r.json(); if (view === 'progres' && !$('phov')) R(); } } catch (e) {}
}
async function shrink(file, max, q) {   // redimensionne et ré-encode en JPEG : retire aussi les métadonnées (position GPS comprise)
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((ok, ko) => c.toBlob(b => b ? ok(b) : ko(new Error('Image illisible')), 'image/jpeg', q));
}
async function addPhoto(inp) {
  const f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
  const note = ($('ph-note') || {}).value || '';
  try {
    toast('Envoi de la photo…');
    const [big, small] = await Promise.all([shrink(f, 1280, .82), shrink(f, 480, .75)]);
    const fd = new FormData(); fd.append('img', big, 'p.jpg'); fd.append('thumb', small, 't.jpg'); fd.append('day', today()); fd.append('note', note);
    const r = await fetch('/api/photos', {method: 'POST', body: fd});
    if (!r.ok) { let j = null; try { j = await r.json(); } catch (e) {} throw new Error((j && j.error) || 'Erreur ' + r.status); }
    await loadPhotos(); toast('Photo enregistrée');
  } catch (e) { toast('Échec : ' + e.message); }
}
function showPhoto(i) {
  let o = $('phov');
  if (!PH || !PH[i]) { if (o) o.remove(); return; }
  if (!o) { o = document.createElement('div'); o.id = 'phov'; o.className = 'pr-overlay'; o.onclick = ev => { if (ev.target === o) o.remove(); }; document.body.appendChild(o); }
  const p = PH[i];
  o.innerHTML = `<div class="phv"><img src="${photoUrl(p.id, 'full')}" alt="Photo du ${frDate(p.day)}"><p><b>${frDate(p.day)}</b>${p.note ? ' · ' + esc(p.note) : ''}</p><div class="acts"><button class="sm" onclick="showPhoto(${i - 1})" ${i <= 0 ? 'disabled' : ''}>‹</button><button class="sm" onclick="showPhoto(${i + 1})" ${i >= PH.length - 1 ? 'disabled' : ''}>›</button><button class="sm danger" onclick="delPhoto(${p.id})">Supprimer</button><button class="sm" onclick="$('phov').remove()">Fermer</button></div></div>`;
}
async function delPhoto(id) {
  if (!confirm('Supprimer définitivement cette photo ?')) return;
  try { const r = await fetch('/api/photos/' + id, {method: 'DELETE'}); if (!r.ok) throw new Error('Erreur ' + r.status); const o = $('phov'); if (o) o.remove(); await loadPhotos(); toast('Photo supprimée'); }
  catch (e) { toast('Échec : ' + e.message); }
}
function vPhotos() {
  if (PH === null) { PH = []; loadPhotos(); }
  // appli (mode local) : IndexedDB, sur le téléphone ; version serveur : app.py les écrit dans PHOTO_DIR, à côté de la base, sur le serveur
  let h = `<section class="card"><h2>Photos de progression</h2><p class="m">${window.FONTE_LOCAL ? 'Gardées sur ce téléphone, envoyées nulle part.' : 'Gardées sur ton serveur Fonte, envoyées nulle part ailleurs.'}</p>`;
  if (PH.length >= 2) {
    const a = PH[0], b = PH[PH.length - 1];
    h += `<div class="phcmp"><figure><img src="${photoUrl(a.id, 'full')}" alt="Première photo"><figcaption>Départ · ${frDate(a.day)}</figcaption></figure><figure><img src="${photoUrl(b.id, 'full')}" alt="Dernière photo"><figcaption>Dernière · ${frDate(b.day)}</figcaption></figure></div>`;
  }
  if (PH.length) h += '<div class="phgrid">' + PH.map((p, i) => `<button onclick="showPhoto(${i})" aria-label="Photo du ${frDate(p.day)}"><img src="${photoUrl(p.id, 'thumb')}" loading="lazy" alt=""><span>${frDate(p.day).slice(0, 5)}</span></button>`).join('') + '</div>';
  else h += '<p class="none">Aucune photo pour l’instant.</p>';
  h += `<div class="stk"><input id="ph-note" maxlength="200" placeholder="Note (facultatif)" aria-label="Note de la photo"><button class="sm" onclick="$('ph-in').click()">Ajouter une photo</button></div><input id="ph-in" type="file" accept="image/*" hidden onchange="addPhoto(this)"></section>`;
  return h;
}

/* passerelle lue par jeu.js (les let/const ci-dessus ne sont pas sur window) */
/* après le remplacement des programmes par le questionnaire : les séances en cours non enregistrées sont gardées,
   rattachées à « séance libre » ; un formulaire vide et intact est simplement oublié */
function forgetWorkouts(ids) {
  const gone = f => f && f.wid != null && ids.includes(f.wid);
  if (gone(F)) { if (F.dirty || F.xid || F.mode === 'edit') { F.wid = null; if (!F.xid && F.mode === 'new') store(draftKey(), F); } else { F = null; store(draftKey()); } }
  XS.forEach(x => { if (gone(x)) x.wid = null; }); saveXS();
  const d = recall(draftKey());
  if (gone(d)) { if (d.dirty) { d.wid = null; store(draftKey(), d); } else store(draftKey()); }
  curW = null; progW = null; progDraft = null; FOC = null;
}
function pendingDraft() { const d = recall(draftKey()); return XS.length > 0 || !!(d && d.dirty) || !!(F && F.mode === 'new' && F.dirty); }
window.APPX = {vib, dureeMin, SESS: () => SESS, EX: () => EX, WO: () => WO, zonesOf, mondayOf, today, get WGOAL() { return WGOAL; }, computePRs, figSvg, toast, R, go, nav, api, load, forgetWorkouts, pendingDraft, nextWorkout, view: () => view};

/* ------------------------------------------------------------------ démarrage */
if (!window.FONTE_LOCAL && 'serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
(async () => {
  /* l'appli s'ouvre sur l'accueil */
  try { await load(); if (window.JEU) { JEU.init(); JEU.applyWardrobe(); } if (window.PROFIL && PROFIL.init()) view = 'profil'; R(); }
  catch (e) { $('app').innerHTML = `<p class="empty">${window.FONTE_LOCAL ? 'Impossible de lire les données de l’appli' : 'Impossible de joindre le serveur'}\u00a0: ${esc(e.message)}</p>`; }
})();
</script>
